  </div>
  <script>
  'use strict';

  /* =========================================================================
     DOM REFERENCES
     ========================================================================= */
  const uploadZone   = document.getElementById('uploadZone');
  const fileInput    = document.getElementById('fileInput');
  const mainUI       = document.getElementById('mainUI');
  const newJumpBtn   = document.getElementById('newJumpBtn');
  const videoEl      = document.getElementById('videoEl');
  const playBtn      = document.getElementById('playBtn');
  const playIcon     = document.getElementById('playIcon');
  const frameSlider  = document.getElementById('frameSlider');
  const frameCounter = document.getElementById('frameCounter');
  const frameLabelEnd = document.getElementById('frameLabelEnd');
  const markTakeoffBtn = document.getElementById('markTakeoff');
  const markLandingBtn = document.getElementById('markLanding');
  const takeoffVal   = document.getElementById('takeoffVal');
  const landingVal   = document.getElementById('landingVal');
  const framesInAir  = document.getElementById('framesInAir');
  const calcBtn      = document.getElementById('calcBtn');
  const reading      = document.getElementById('reading');
  const trajectory   = document.getElementById('trajectory');
  const trajArc      = document.getElementById('trajArc');
  const trajBase     = document.getElementById('trajBase');
  const trajApex     = document.getElementById('trajApex');
  const trajDotA     = document.getElementById('trajDotA');
  const trajDotB     = document.getElementById('trajDotB');
  const trajLblA     = document.getElementById('trajLblA');
  const trajLblB     = document.getElementById('trajLblB');
  const measureBadge = document.getElementById('measureBadge');
  const readoutLine  = document.getElementById('readoutLine');
  const videoFilename = document.getElementById('videoFilename');
  const fpsRow       = document.getElementById('fpsRow');
  const fpsNote      = document.getElementById('fpsNote');

  /* =========================================================================
     STATE
     ========================================================================= */
  let fps = null;                 // resolved frame rate, null until known
  let fpsSource = null;           // 'container' | 'playback' | 'manual'
  let detectionDone = false;      // has an attempt to resolve fps finished?
  let totalFrames = 0;
  // Markers are stored as media TIME (fps-independent) and derived into frame
  // indices, so changing the frame rate re-quantises them instead of destroying them.
  let takeoffTime = null;
  let landingTime = null;
  let takeoffFrame = null;
  let landingFrame = null;
  let isPlaying = false;
  let rafId = null;
  let sliderDragging = false;
  let objectURL = null;
  let loadToken = 0;              // invalidates async work when a new video loads

  /* =========================================================================
     TIMELINE  (frame index <-> media time)
     ========================================================================= */
  function clampFrame(f) { return Math.max(0, Math.min(f, Math.max(0, totalFrames - 1))); }
  function currentFrame() { return fps ? Math.round(videoEl.currentTime * fps) : 0; }
  function frameToTime(f) { return fps ? f / fps : 0; }

  function recomputeTimeline() {
    if (fps == null || !isFinite(videoEl.duration) || videoEl.duration <= 0) return;
    // NOTE: intentionally duration * fps rather than the container sample count.
    // Real iPhone files carry PTS offsets and discontinuities, so the sample count
    // does not map onto the 0..duration timeline this slider indexes.
    totalFrames = Math.max(1, Math.floor(videoEl.duration * fps));
    frameSlider.max = String(totalFrames - 1);
    frameLabelEnd.textContent = String(totalFrames - 1);
    const cur = Math.min(parseInt(frameSlider.value, 10) || 0, totalFrames - 1);
    frameSlider.value = String(cur);
    seekToFrame(cur);
    renderMarkers();
  }

  function seekToFrame(f) {
    if (fps == null) return;
    f = clampFrame(f);
    videoEl.currentTime = frameToTime(f);
    frameSlider.value = String(f);
    updateCounter();
  }

  function updateCounter() {
    if (fps == null || !totalFrames) { frameCounter.textContent = 'Frame — / —'; return; }
    const f = Math.min(currentFrame(), totalFrames - 1);
    frameCounter.textContent = `Frame ${f} / ${totalFrames - 1}`;
  }

  /* =========================================================================
     FRAME RATE SELECTION
     ========================================================================= */
  const PRESETS = [23.976, 24, 25, 29.97, 30, 50, 59.94, 60, 90, 100, 119.88, 120, 200, 240];

  function fpsLabel(v) { return (Math.round(v * 1000) / 1000).toString(); }

  function snapToPreset(v) {
    let best = null, bestErr = Infinity;
    for (const p of PRESETS) {
      const err = Math.abs(p - v) / p;
      if (err < bestErr) { bestErr = err; best = p; }
    }
    return bestErr <= 0.02 ? best : null;
  }

  function updateFpsUi() {
    fpsRow.querySelectorAll('.fps-btn.dynamic').forEach(b => b.remove());
    let matched = null;
    fpsRow.querySelectorAll('.fps-btn').forEach(b => {
      const v = parseFloat(b.dataset.fps);
      const on = fps != null && Math.abs(v - fps) < 0.05;
      b.classList.toggle('active', on);
      if (on) matched = b;
    });
    if (fps != null && !matched) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fps-btn dynamic active';
      b.dataset.fps = String(fps);
      b.textContent = fpsLabel(fps) + ' fps';
      fpsRow.appendChild(b);
    }
    fpsNote.className = 'fps-note';
    if (fps == null && !detectionDone) {
      fpsNote.textContent = 'Detecting frame rate…';
    } else if (fps == null) {
      fpsNote.textContent = "Couldn't detect the frame rate — select it manually.";
      fpsNote.classList.add('warn');
    } else if (fpsSource === 'container') {
      fpsNote.textContent = `Detected ${fpsLabel(fps)} fps from the video file. Change it if that's wrong.`;
      fpsNote.classList.add('ok');
    } else if (fpsSource === 'playback') {
      fpsNote.textContent = `Measured ${fpsLabel(fps)} fps by playing the video. Change it if that's wrong.`;
    } else {
      fpsNote.textContent = '';
    }
  }

  function setFps(value, source) {
    fps = value;
    fpsSource = source;
    updateFpsUi();
    if (videoEl.src && isFinite(videoEl.duration)) recomputeTimeline();
    syncButtons();
  }

  // Delegated so the dynamically-added detected-rate button works too.
  fpsRow.addEventListener('click', e => {
    const btn = e.target.closest('.fps-btn');
    if (!btn || btn.disabled) return;
    const value = parseFloat(btn.dataset.fps);
    if (!isFinite(value) || value <= 0) return;
    setFps(value, 'manual');
  });

  /* =========================================================================
     MARKERS
     ========================================================================= */
  function setChip(el, value) {
    if (value == null) { el.textContent = '—'; el.classList.add('unset'); }
    else { el.textContent = String(value); el.classList.remove('unset'); }
  }

  function hasValidMarks() {
    return takeoffFrame != null && landingFrame != null && (landingFrame - takeoffFrame) > 0;
  }

  function renderMarkers() {
    // A marker change invalidates both the unsaved result and any stored jump on
    // screen. restoringMarkers is set while viewJump replays a stored jump's markers,
    // which is the one case where the viewed jump must survive.
    if (!restoringMarkers) { savedJump = null; viewed = null; }
    takeoffFrame = takeoffTime == null || fps == null
      ? null : clampFrame(Math.round(takeoffTime * fps));
    landingFrame = landingTime == null || fps == null
      ? null : clampFrame(Math.round(landingTime * fps));
    setChip(takeoffVal, takeoffFrame);
    setChip(landingVal, landingFrame);
    const diff = (takeoffFrame != null && landingFrame != null) ? landingFrame - takeoffFrame : null;
    if (diff != null && diff > 0) {
      framesInAir.textContent = String(diff);
      framesInAir.classList.remove('unset');
    } else {
      framesInAir.textContent = diff != null ? 'err' : '—';
      framesInAir.classList.add('unset');
    }
    markTakeoffBtn.classList.toggle('set', takeoffFrame != null);
    markLandingBtn.classList.toggle('set', landingFrame != null);
    hideReading();                         // any marker change invalidates shown results
    syncButtons();
  }

  function resetMarkers() {
    takeoffTime = null; landingTime = null;
    hideReading();
    renderMarkers();
  }

  function syncButtons() {
    const ready = fps != null && videoEl.src !== '' && totalFrames > 0;
    // Playback stays available even before the frame rate is known, so the user can
    // still watch the clip while deciding; only frame-indexed controls are gated.
    playBtn.disabled = videoEl.src === '';
    frameSlider.disabled = !ready;
    document.getElementById('prevFrame').disabled = !ready;
    document.getElementById('nextFrame').disabled = !ready;
    markTakeoffBtn.disabled = !ready;
    markLandingBtn.disabled = !ready;
    calcBtn.disabled = !ready || !hasValidMarks();
  }

  /* =========================================================================
     VIDEO LOADING
     ========================================================================= */
  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = '#888'; });
  uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.style.borderColor = '';
    if (e.dataTransfer.files[0]) loadVideo(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadVideo(e.target.files[0]); });

  newJumpBtn.addEventListener('click', () => {
    if (isPlaying) stopPlayback();
    loadToken++;
    if (objectURL) { URL.revokeObjectURL(objectURL); objectURL = null; }
    videoEl.removeAttribute('src');
    videoEl.load();
    fileInput.value = '';
    mainUI.classList.add('hidden');
    uploadZone.classList.remove('hidden');
    videoFilename.textContent = '';
    detectionDone = false;
    fps = null; fpsSource = null; totalFrames = 0;
    fpsNote.className = 'fps-note';
    fpsNote.textContent = 'Detecting frame rate…';
    updateFpsUi();
    resetMarkers();          // clears viewed and savedJump too
    renderJumpNav();
  });

  async function loadVideo(file) {
    const token = ++loadToken;
    detectionDone = false;
    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(file);
    videoEl.src = objectURL;
    videoEl.load();
    videoFilename.textContent = file.name;
    fps = null; fpsSource = null; totalFrames = 0;
    updateFpsUi();
    resetMarkers();
    syncButtons();

    const ok = await new Promise(resolve => {
      const done = () => resolve(true);
      videoEl.addEventListener('loadedmetadata', done, { once: true });
      videoEl.addEventListener('error', () => resolve(false), { once: true });
      setTimeout(() => resolve(videoEl.readyState >= 1), 8000);
    });
    if (token !== loadToken) return;
    if (!ok || !isFinite(videoEl.duration)) {
      fpsNote.className = 'fps-note warn';
      fpsNote.textContent = 'Could not read this video file.';
      return;
    }

    mainUI.classList.remove('hidden');
    uploadZone.classList.add('hidden');

    const resolved = await resolveFrameRate(file, token);
    if (token !== loadToken) return;
    detectionDone = true;
    if (resolved) setFps(resolved.fps, resolved.source);
    else { fps = null; fpsSource = null; updateFpsUi(); syncButtons(); }
  }

  async function resolveFrameRate(file, token) {
    try {
      const info = await probeContainer(file);
      if (token !== loadToken) return null;
      if (info && info.fps > 0) {
        const snapped = snapToPreset(info.fps) || info.fps;
        console.debug('[fps] container', info.fps, '->', snapped, info);
        return { fps: snapped, source: 'container' };
      }
    } catch (e) { console.debug('[fps] container probe failed', e); }

    try {
      const measured = await measureFps();
      if (token !== loadToken) return null;
      if (measured) {
        console.debug('[fps] measured', measured);
        return { fps: measured, source: 'playback' };
      }
    } catch (e) { console.debug('[fps] measurement failed', e); }
    return null;
  }

  /* =========================================================================
     FPS DETECTION (BEGIN) — pure functions, no DOM access
     ========================================================================= */

  function u8str(u8, off, len) {
    let s = '';
    for (let i = 0; i < len; i++) s += String.fromCharCode(u8[off + i]);
    return s;
  }
  function dvstr(dv, off, len) { return u8str(new Uint8Array(dv.buffer, dv.byteOffset + off, len), 0, len); }

  async function readBoxHeaderAt(file, off) {
    const u8 = new Uint8Array(await file.slice(off, off + 16).arrayBuffer());
    if (u8.length < 8) return null;
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let size = dv.getUint32(0);
    const type = u8str(u8, 4, 4);
    let headerSize = 8;
    if (size === 1) {
      if (u8.length < 16) return null;
      size = dv.getUint32(8) * 4294967296 + dv.getUint32(12);
      headerSize = 16;
    } else if (size === 0) {
      size = file.size - off;
    }
    return { size, type, headerSize };
  }

  // Walk top-level boxes by header only. Boxes such as mdat are skipped by offset,
  // so a moov at the end of the file costs a handful of small reads, not a full scan.
  async function findTopLevelBox(file, type) {
    let off = 0, guard = 0;
    while (off + 8 <= file.size && guard++ < 128) {
      const h = await readBoxHeaderAt(file, off);
      if (!h || h.size < h.headerSize) return null;
      if (h.type === type) {
        return { start: off, headerSize: h.headerSize, end: Math.min(off + h.size, file.size) };
      }
      off += h.size;
    }
    return null;
  }

  function readBoxes(dv, start, end) {
    const boxes = [];
    let off = start;
    while (off + 8 <= end) {
      let size = dv.getUint32(off);
      const type = dvstr(dv, off + 4, 4);
      let headerSize = 8;
      if (size === 1) {
        if (off + 16 > end) break;
        size = dv.getUint32(off + 8) * 4294967296 + dv.getUint32(off + 12);
        headerSize = 16;
      } else if (size === 0) {
        size = end - off;
      }
      if (size < headerSize) break;
      if (off + size > end) size = end - off;   // tolerate a truncated tail box
      boxes.push({ type, start: off, headerSize, end: off + size });
      off += size;
    }
    return boxes;
  }

  function childBox(dv, box, type) {
    return readBoxes(dv, box.start + box.headerSize, box.end).find(b => b.type === type) || null;
  }

  function readMdhdTimescale(dv, mdhd) {
    const b = mdhd.start + mdhd.headerSize;
    const version = dv.getUint8(b);
    return version === 1 ? dv.getUint32(b + 20) : dv.getUint32(b + 12);
  }

  // Returns the total media duration covered by the video samples plus their count.
  // Summing stts is what makes this robust: these files routinely contain PTS
  // offsets and discontinuities that corrupt a duration/frameCount estimate.
  function readStts(dv, stts) {
    const b = stts.start + stts.headerSize;
    const entries = dv.getUint32(b + 4);
    const list = [];
    let samples = 0, totalDuration = 0;
    for (let i = 0; i < entries; i++) {
      const p = b + 8 + i * 8;
      if (p + 8 > stts.end) break;
      const count = dv.getUint32(p);
      const delta = dv.getUint32(p + 4);
      list.push({ count, delta });
      samples += count;
      totalDuration += count * delta;
    }
    return { entries, samples, totalDuration, list };
  }

  async function parseMp4(file) {
    const moov = await findTopLevelBox(file, 'moov');
    if (!moov) return null;
    const dv = new DataView(await file.slice(moov.start + moov.headerSize, moov.end).arrayBuffer());
    for (const trak of readBoxes(dv, 0, dv.byteLength).filter(b => b.type === 'trak')) {
      const mdia = childBox(dv, trak, 'mdia'); if (!mdia) continue;
      const hdlr = childBox(dv, mdia, 'hdlr');
      if (!hdlr) continue;
      // hdlr layout: version/flags (4) + pre_defined (4) + handler_type (4)
      if (dvstr(dv, hdlr.start + hdlr.headerSize + 8, 4) !== 'vide') continue;
      const mdhd = childBox(dv, mdia, 'mdhd'); if (!mdhd) continue;
      const minf = childBox(dv, mdia, 'minf'); if (!minf) continue;
      const stbl = childBox(dv, minf, 'stbl'); if (!stbl) continue;
      const stts = childBox(dv, stbl, 'stts'); if (!stts) continue;
      const timescale = readMdhdTimescale(dv, mdhd);
      if (!timescale) continue;
      const { samples, totalDuration, list } = readStts(dv, stts);
      if (!samples || !totalDuration || !list.length) continue;
      let sampleCount = samples;
      const stsz = childBox(dv, stbl, 'stsz');
      if (stsz) {
        const c = dv.getUint32(stsz.start + stsz.headerSize + 8);
        if (c) sampleCount = c;
      }
      // Use the interval the samples actually use. Summing the whole stts folds in rare
      // long gaps from paused or edited recordings; on the real iPhone clips in this
      // project that dragged the result to 29.22 fps when the true interval is 30.
      // Counts must be aggregated BY DELTA VALUE, not per stts entry: these files split
      // a uniform 30fps stream across ~25 entries, so no single entry dominates.
      // Only fall back to a duration-weighted average when no one interval dominates,
      // which means a genuinely variable-frame-rate file with no single correct answer.
      const byDelta = new Map();
      for (const e of list) byDelta.set(e.delta, (byDelta.get(e.delta) || 0) + e.count);
      let bestDelta = 0, bestCount = 0;
      for (const [delta, count] of byDelta) if (count > bestCount) { bestCount = count; bestDelta = delta; }
      const vfr = (bestCount / samples) < 0.9;
      return {
        fps: vfr ? (samples * timescale / totalDuration) : (timescale / bestDelta),
        container: 'mp4',
        timescale,
        frameCount: sampleCount,
        vfr
      };
    }
    return null;
  }

  function ebmlID(dv, off) {
    const first = dv.getUint8(off);
    if (!first) return null;
    let len = 1;
    for (let m = 0x80; m; m >>= 1, len++) if (first & m) break;
    if (len > 8 || off + len > dv.byteLength) return null;
    let id = 0;
    for (let i = 0; i < len; i++) id = id * 256 + dv.getUint8(off + i);
    return { id, len };
  }

  function ebmlSize(dv, off) {
    const first = dv.getUint8(off);
    if (!first) return null;
    let len = 1;
    for (let m = 0x80; m; m >>= 1, len++) if (first & m) break;
    if (len > 8 || off + len > dv.byteLength) return null;
    let value = first & (0xFF >> len);
    for (let i = 1; i < len; i++) value = value * 256 + dv.getUint8(off + i);
    return { value, len };
  }

  function ebmlFirstChild(dv, start, end, wantId) {
    let off = start;
    while (off < end) {
      const id = ebmlID(dv, off); if (!id) return null;
      const sz = ebmlSize(dv, off + id.len); if (!sz) return null;
      const bodyStart = off + id.len + sz.len;
      const bodyEnd = Math.min(bodyStart + sz.value, end);
      if (id.id === wantId) return { start: bodyStart, end: bodyEnd };
      if (bodyEnd <= off) return null;
      off = bodyEnd;
    }
    return null;
  }

  async function parseWebm(file) {
    const limit = Math.min(file.size, 2 * 1024 * 1024);
    const u8 = new Uint8Array(await file.slice(0, limit).arrayBuffer());
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const segment = ebmlFirstChild(dv, 0, dv.byteLength, 0x18538067); if (!segment) return null;
    const tracks = ebmlFirstChild(dv, segment.start, segment.end, 0x1654AE6B); if (!tracks) return null;
    let off = tracks.start;
    while (off < tracks.end) {
      const id = ebmlID(dv, off); if (!id) break;
      const sz = ebmlSize(dv, off + id.len); if (!sz) break;
      const bodyStart = off + id.len + sz.len;
      const bodyEnd = Math.min(bodyStart + sz.value, tracks.end);
      if (id.id === 0xAE) {
        const trackType = ebmlFirstChild(dv, bodyStart, bodyEnd, 0x83);
        const isVideo = trackType && (trackType.end - trackType.start) >= 1 && dv.getUint8(trackType.start) === 1;
        if (isVideo) {
          const video = ebmlFirstChild(dv, bodyStart, bodyEnd, 0xE0);
          if (video) {
            const dd = ebmlFirstChild(dv, video.start, video.end, 0x23E383);
            if (dd) {
              let ns = 0;
              for (let i = dd.start; i < dd.end; i++) ns = ns * 256 + dv.getUint8(i);
              if (ns > 0) return { fps: 1e9 / ns, container: 'webm', frameCount: null, vfr: false };
            }
          }
        }
      }
      if (bodyEnd <= off) break;
      off = bodyEnd;
    }
    return null;
  }

  async function probeContainer(file) {
    try {
      const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
      if (head.length >= 12 && u8str(head, 4, 4) === 'ftyp') return await parseMp4(file);
      if (head.length >= 4 && head[0] === 0x1a && head[1] === 0x45 && head[2] === 0xdf && head[3] === 0xa3) {
        return await parseWebm(file);
      }
      // QuickTime/ISO files without an ftyp first (moov/mdat/wide/free/skip/pnot)
      if (head.length >= 8) {
        const t = u8str(head, 4, 4);
        if (t === 'moov' || t === 'mdat' || t === 'wide' || t === 'free' || t === 'skip' || t === 'pnot') {
          return await parseMp4(file);
        }
      }
    } catch (e) { console.debug('[fps] probe error', e); }
    return null;
  }
  /* ===== FPS DETECTION (END) ===== */

  /* =========================================================================
     FPS MEASUREMENT (fallback: play the video and time the presented frames)
     ========================================================================= */
  function frameReady(timeout = 30) {
    return new Promise(resolve => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      if (typeof videoEl.requestVideoFrameCallback === 'function') {
        try { videoEl.requestVideoFrameCallback(finish); } catch (e) { /* ignore */ }
      } else {
        requestAnimationFrame(() => requestAnimationFrame(finish));
      }
      setTimeout(finish, timeout);
    });
  }

  function estimateRefreshRate() {
    return new Promise(resolve => {
      let n = 0, first = 0, last = 0;
      const step = t => {
        if (n === 0) first = t;
        last = t; n++;
        if (n >= 12) {
          const dt = last - first;
          resolve(dt > 0 ? (n - 1) / (dt / 1000) : 0);
          return;
        }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  // The presented frame rate is capped by the display refresh rate, so a 240fps
  // clip on a 60Hz screen measures ~60. That is a confident wrong answer, not a
  // failure, so results at the ceiling are rejected rather than trusted.
  async function measureFps() {
    if (typeof videoEl.requestVideoFrameCallback !== 'function') return null;
    const refresh = await estimateRefreshRate();
    if (!(refresh >= 24)) return null;               // implausible -> cannot judge the ceiling
    const savedTime = videoEl.currentTime;
    const savedMuted = videoEl.muted;
    const restore = () => {
      try { videoEl.pause(); } catch (e) { /* ignore */ }
      videoEl.muted = savedMuted;
      try { videoEl.currentTime = savedTime; } catch (e) { /* ignore */ }
    };
    videoEl.muted = true;
    const intervals = [];
    let prev = null;
    try {
      await videoEl.play();
    } catch (e) { videoEl.muted = savedMuted; return null; }

    await new Promise(resolve => {
      let settled = false;
      const done = () => { if (!settled) { settled = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(done, 3000);
      const tick = (now, meta) => {
        if (prev && meta.mediaTime > prev.mediaTime) {
          const frames = Math.max(1, meta.presentedFrames - prev.presentedFrames);
          const interval = (meta.mediaTime - prev.mediaTime) / frames;
          if (interval > 0.0005 && interval < 0.2) intervals.push(interval);
          if (intervals.length >= 45) { done(); return; }
        }
        prev = meta;
        if (videoEl.ended) { done(); return; }
        try { videoEl.requestVideoFrameCallback(tick); } catch (e) { done(); }
      };
      try { videoEl.requestVideoFrameCallback(tick); } catch (e) { done(); }
    });

    restore();
    if (intervals.length < 8) return null;
    intervals.sort((a, b) => a - b);
    const median = intervals[intervals.length >> 1];
    const measured = 1 / median;
    if (!isFinite(measured) || measured <= 0) return null;
    if (measured >= refresh * 0.95) return null;     // at the display ceiling -> ambiguous
    return snapToPreset(measured) || measured;
  }

  /* =========================================================================
     PLAYBACK
     ========================================================================= */
  playBtn.addEventListener('click', togglePlay);

  function togglePlay() { isPlaying ? stopPlayback() : startPlayback(); }

  function startPlayback() {
    videoEl.play().then(() => { isPlaying = true; }).catch(() => {});
    playIcon.className = 'ti ti-player-pause';
    rafId = requestAnimationFrame(rafLoop);
  }

  function stopPlayback() {
    videoEl.pause(); isPlaying = false;
    playIcon.className = 'ti ti-player-play';
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function rafLoop() {
    if (isPlaying) {
      if (!sliderDragging && fps != null) {
        frameSlider.value = String(Math.min(currentFrame(), Math.max(0, totalFrames - 1)));
        updateCounter();
          }
      if (videoEl.ended) { stopPlayback(); return; }
      rafId = requestAnimationFrame(rafLoop);
    }
  }

  videoEl.addEventListener('ended', stopPlayback);

  frameSlider.addEventListener('input', () => { sliderDragging = true; seekToFrame(parseInt(frameSlider.value, 10)); });
  frameSlider.addEventListener('change', () => { sliderDragging = false; });
  document.getElementById('prevFrame').addEventListener('click', () => { if (isPlaying) stopPlayback(); seekToFrame(currentFrame() - 1); });
  document.getElementById('nextFrame').addEventListener('click', () => { if (isPlaying) stopPlayback(); seekToFrame(currentFrame() + 1); });

  /* =========================================================================
     MARKING
     ========================================================================= */
  markTakeoffBtn.addEventListener('click', () => {
    if (fps == null) return;
    takeoffTime = frameToTime(currentFrame());
    renderMarkers();
  });

  markLandingBtn.addEventListener('click', () => {
    if (fps == null) return;
    landingTime = frameToTime(currentFrame());
    renderMarkers();
  });

  /* =========================================================================
     CALCULATION AND THE READING
     ========================================================================= */
  calcBtn.addEventListener('click', () => {
    if (takeoffFrame == null || landingFrame == null) return;
    const frames = landingFrame - takeoffFrame;
    const t = frames / fps;
    const halfT = t / 2;
    const d = 0.5 * 9.81 * halfT * halfT;   // metres; matches the force-plate JH-2 definition
    showReading(t, frames, d);
  });

  function hideReading() { reading.classList.add('hidden'); }

  function showReading(t, frames, metres) {
    const cm = metres * 100;
    const inches = metres * 39.3701;
    measureBadge.innerHTML = `${cm.toFixed(1)}<span class="unit">cm</span>`;
    measureBadge.setAttribute('aria-label', `${cm.toFixed(1)} centimetres`);
    readoutLine.innerHTML =
      `<strong>${t.toFixed(3)} s</strong> flight · ${frames} frames @ ${fpsLabel(fps)} fps · ${inches.toFixed(1)} in`;
    drawTrajectory();
    reading.classList.remove('hidden');
    // one orchestrated trace of the arc when a result lands
    trajectory.classList.remove('animate');
    void trajectory.offsetWidth;
    trajectory.classList.add('animate');

    // arm the save: this result is now a candidate for the career record.
    // takeoffTime and landingTime ride along so a saved jump can put its own markers
    // back on the timeline later, while its video is still loaded.
    savedJump = {
      videoName: videoFilename.textContent || 'clip',
      fps, frames,
      takeoffTime, landingTime,
      duration: videoEl.duration,
      flightTime: t,
      heightCm: cm,
      heightIn: inches
    };
    viewed = null;                 // a fresh result replaces anything being viewed
    setNote('');
    refreshSaveButton();
  }

  // Draws the flight path itself: a parabola from the marked takeoff frame to the
  // landing frame, with the apex dimensioned. Height scales with the measured value,
  // so the diagram is a readout and not decoration.
  function drawTrajectory(flightSeconds) {
    const VW = 320, VH = 136;
    const baseY = 120, topY = 30;
    const x0 = 16, x1 = VW - 16;
    // The arc depends only on flight time, so it can be redrawn for a stored jump with
    // no video loaded. Fall back to the live markers when called without an argument.
    const flight = flightSeconds != null ? flightSeconds : (landingFrame - takeoffFrame) / fps;
    // normalise against a 1.2 s flight so a bigger jump visibly draws taller
    const f = Math.max(0.12, Math.min(1, flight / 1.2));
    const apexY = baseY - (baseY - topY) * f;
    const apexX = (x0 + x1) / 2;

    // quadratic through (x0,baseY), (apexX,apexY), (x1,baseY) -> control point
    const ctrlY = 2 * apexY - baseY;
    trajArc.setAttribute('d', `M ${x0} ${baseY} Q ${apexX} ${ctrlY} ${x1} ${baseY}`);

    trajBase.setAttribute('x1', 0); trajBase.setAttribute('x2', VW);
    trajBase.setAttribute('y1', baseY); trajBase.setAttribute('y2', baseY);

    trajApex.setAttribute('x1', apexX); trajApex.setAttribute('x2', apexX);
    trajApex.setAttribute('y1', baseY); trajApex.setAttribute('y2', apexY);

    [trajDotA, trajDotB].forEach((d2, i) => {
      d2.setAttribute('cx', i === 0 ? x0 : x1);
      d2.setAttribute('cy', baseY);
    });
    // anchored inward: the viewBox is stretched, so centred text overflows the card
    trajLblA.setAttribute('x', x0 - 4); trajLblA.setAttribute('y', baseY + 13);
    trajLblB.setAttribute('x', x1 + 4); trajLblB.setAttribute('y', baseY + 13);

    // total path length, so the trace animation can run edge to edge
    const len = 2 * Math.hypot(apexX - x0, apexY - baseY) * 1.06;
    trajectory.style.setProperty('--arc-len', len.toFixed(1));
  }

  /* =========================================================================
     CAREER DASHBOARD — sessions, daily means, and the trend chart

     One session is one day and holds every jump measured that day. The chart
     plots the session mean, which is the mean of that day's jumps.
     ========================================================================= */

  const STORE_KEY = 'vjc:sessions:v1';
  const STORE_VERSION = 1;
  const MB = 1e6;

  let sessions = [];                  // newest first
  let activeSessionId = null;         // the session a new jump is saved into
  let savedJump = null;               // the result currently shown, not yet stored
  let viewed = null;                  // { sessionId, jumpId } of a stored jump on screen
  let restoringMarkers = false;       // true while viewJump replays a stored jump's markers
  let chartRange = 'all';

  const tabMeasure   = document.getElementById('tabMeasure');
  const tabCareer    = document.getElementById('tabCareer');
  const panelMeasure = document.getElementById('panelMeasure');
  const panelCareer  = document.getElementById('panelCareer');
  const sessionName  = document.getElementById('sessionName');
  const saveJumpBtn  = document.getElementById('saveJump');
  const saveNote     = document.getElementById('saveNote');
  const careerEmpty  = document.getElementById('careerEmpty');
  const careerBody   = document.getElementById('careerBody');
  const statStrip    = document.getElementById('statStrip');
  const careerChart  = document.getElementById('careerChart');
  const careerSummary = document.getElementById('careerSummary');
  const careerLegend = document.getElementById('careerLegend');
  const sessionList  = document.getElementById('sessionList');
  const jumpNav      = document.getElementById('jumpNav');
  const jumpNavLabel = document.getElementById('jumpNavLabel');
  const prevJumpBtn  = document.getElementById('prevJump');
  const nextJumpBtn  = document.getElementById('nextJump');

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // Local calendar date. Avoid toISOString(): it converts to UTC, so a jump at
  // 8pm local in a negative-offset zone would be filed under tomorrow.
  function todayKey(d = new Date()) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function loadSessions() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(s => s && typeof s.date === 'string' && Array.isArray(s.jumps))
        .map(s => ({
          ...s,
          // jumps saved before markers were recorded have no takeoffTime, so heightCm is
          // the one field every shape is guaranteed to carry
          jumps: s.jumps.filter(j => j && isFinite(j.heightCm))
        }));
    } catch (e) {
      console.debug('[career] could not read stored sessions', e);
      return [];
    }
  }

  // The session's jumps in the order they were measured, which is the order the
  // stepper walks. The list sorts by height instead; the two deliberately differ.
  function jumpsOf(session) {
    return session ? session.jumps.slice().sort((a, b) => (a.savedAt || 0) - (b.savedAt || 0)) : [];
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(sessions));
      return true;
    } catch (e) {
      console.debug('[career] save failed', e);
      setNote('Could not save to this browser. Storage may be full or blocked — export first.',
              'warn');
      return false;
    }
  }

  function setNote(msg, cls) {
    saveNote.textContent = msg || '';
    saveNote.className = 'save-note' + (cls ? ' ' + cls : '');
  }

  function sessionMean(s) {
    if (!s.jumps.length) return null;
    return s.jumps.reduce((a, j) => a + j.heightCm, 0) / s.jumps.length;
  }

  function sortSessions() {
    sessions.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }

  function ensureTodaySession() {
    const key = todayKey();
    let s = sessions.find(x => x.date === key);
    if (!s) {
      s = { id: uid(), date: key, name: key, jumps: [] };
      sessions.unshift(s);
      sortSessions();
    }
    activeSessionId = s.id;
    return s;
  }

  function activeSession() {
    return sessions.find(s => s.id === activeSessionId) || null;
  }

  /* ---- tabs ---- */
  function selectTab(which) {
    const measure = which === 'measure';
    tabMeasure.setAttribute('aria-selected', String(measure));
    tabCareer.setAttribute('aria-selected', String(!measure));
    tabMeasure.tabIndex = measure ? 0 : -1;
    tabCareer.tabIndex = measure ? -1 : 0;
    panelMeasure.classList.toggle('hidden', !measure);
    panelCareer.classList.toggle('hidden', measure);
    if (!measure) renderCareer();
  }
  tabMeasure.addEventListener('click', () => selectTab('measure'));
  tabCareer.addEventListener('click', () => selectTab('career'));
  [tabMeasure, tabCareer].forEach(t => {
    t.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const go = e.key === 'ArrowRight' ? 'career' : 'measure';
      selectTab(go);
      (go === 'career' ? tabCareer : tabMeasure).focus();
    });
  });

  /* ---- saving a jump ---- */
  function refreshSaveButton() {
    const s = activeSession();
    saveJumpBtn.disabled = !savedJump;
    const label = s ? `Save to ${escapeHtml(s.name)}` : 'Save to session';
    saveJumpBtn.innerHTML = `<i class="ti ti-plus" aria-hidden="true"></i> ${label}`;
    saveJumpBtn.setAttribute('aria-label', s ? `Save this jump to ${s.name}` : 'Save this jump');
    saveJumpBtn.title = s ? `Save to ${s.name}` : '';
  }

  saveJumpBtn.addEventListener('click', () => {
    if (!savedJump) return;
    const s = activeSession() || ensureTodaySession();
    const jump = { id: uid(), savedAt: Date.now(), ...savedJump };
    s.jumps.push(jump);
    if (!persist()) return;                 // keep the UI honest if storage refused
    savedJump = null;
    viewed = { sessionId: s.id, jumpId: jump.id };   // the new jump becomes the current one
    setNote(`Saved to "${s.name}". ${plural(s.jumps.length, 'jump')} in this session.`, 'ok');
    refreshSaveButton();
    renderSessionLabel();
  });

  function renderSessionLabel() {
    const s = activeSession();
    if (!s) { sessionName.textContent = '—'; refreshSaveButton(); renderJumpNav(); return; }
    const m = sessionMean(s);
    sessionName.textContent = s.name +
      (s.jumps.length ? ` · ${plural(s.jumps.length, 'jump')} · ${m.toFixed(1)} cm avg` : ' · no jumps yet');
    refreshSaveButton();
    renderJumpNav();
  }

  /* ---- jumping between the jumps recorded in this session ---- */
  function renderJumpNav() {
    // The session being viewed, if any, otherwise the one a new jump would be saved to.
    const s = sessions.find(x => viewed && x.id === viewed.sessionId) || activeSession();
    const list = jumpsOf(s);
    if (!list.length) {
      jumpNav.classList.add('hidden');
      jumpNavLabel.textContent = '—';
      return;
    }
    jumpNav.classList.remove('hidden');
    let i = list.findIndex(j => viewed && j.id === viewed.jumpId);
    if (i < 0) i = list.length - 1;                   // default to the most recent jump
    jumpNavLabel.textContent = `Jump ${i + 1} of ${list.length} · ${list[i].heightCm.toFixed(1)} cm`;
    prevJumpBtn.disabled = i === 0;
    nextJumpBtn.disabled = i === list.length - 1;
  }

  // Puts a stored jump back on screen. The order matters: selectTab first, so the
  // measure panel is visible; then fill the readout; then redraw the arc, which needs
  // only the stored flight time; and only then replay the markers, where the video
  // happens to be the same one this jump came from.
  function viewJump(session, jumpId) {
    const list = jumpsOf(session);
    const i = list.findIndex(j => j.id === jumpId);
    if (i < 0) return;
    const j = list[i];

    selectTab('measure');
    // Making this session active is what lets the stepper walk it. Otherwise the
    // navigator would read today's session while the reading shows another one.
    activeSessionId = session.id;
    ensureTodaySession();
    viewed = { sessionId: session.id, jumpId: j.id };
    savedJump = null;

    const cm = j.heightCm;
    measureBadge.innerHTML = `${cm.toFixed(1)}<span class="unit">cm</span>`;
    measureBadge.setAttribute('aria-label', `${cm.toFixed(1)} centimetres`);
    const inches = isFinite(j.heightIn) ? j.heightIn : cm / 2.54;
    const fpsKnown = isFinite(j.fps) ? `${fpsLabel(j.fps)} fps` : '';
    readoutLine.innerHTML =
      `<strong>${j.flightTime.toFixed(3)} s</strong> flight · ${plural(j.frames, 'frame')} @ ${fpsKnown} · ${inches.toFixed(1)} in`;

    drawTrajectory(j.flightTime);
    reading.classList.remove('hidden');
    trajectory.classList.remove('animate');
    void trajectory.offsetWidth;
    trajectory.classList.add('animate');

    const sameVideo = j.fps === fps && j.takeoffTime != null &&
                      videoFilename.textContent === j.videoName;
    if (sameVideo) {
      restoringMarkers = true;              // this replay must not discard the viewed jump
      takeoffTime = j.takeoffTime;
      landingTime = j.landingTime;
      renderMarkers();
      restoringMarkers = false;
    }

    // the reading is now a stored jump, not a fresh measurement: nothing to save
    refreshSaveButton();
    setNote(`Viewing saved jump from "${session.name}", measured ${formatStamp(j.savedAt)}.`);
    renderSessionLabel();
  }

  function formatStamp(ms) {
    if (!isFinite(ms)) return 'earlier';
    const d = new Date(ms);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function stepJump(delta) {
    const s = sessions.find(x => viewed && x.id === viewed.sessionId) || activeSession();
    const list = jumpsOf(s);
    if (!list.length) return;
    let i = viewed ? list.findIndex(j => j.id === viewed.jumpId) : list.length - 1;
    if (i < 0) i = list.length - 1;
    const next = Math.min(list.length - 1, Math.max(0, i + delta));
    if (next === i) return;
    viewJump(s, list[next].id);
  }

  prevJumpBtn.addEventListener('click', () => stepJump(-1));
  nextJumpBtn.addEventListener('click', () => stepJump(1));

  document.getElementById('sessionRename').addEventListener('click', () => {
    const s = activeSession() || ensureTodaySession();
    const next = prompt('Session name', s.name);
    if (next === null) return;
    const trimmed = next.trim();
    if (trimmed) s.name = trimmed;
    const d = prompt('Date (YYYY-MM-DD)', s.date);
    if (d !== null && /^\d{4}-\d{2}-\d{2}$/.test(d.trim())) s.date = d.trim();
    sortSessions();
    persist();
    renderSessionLabel();
    refreshSaveButton();
    renderCareer();
  });

  /* ---- chart ---- */
  function visibleSessions() {
    // sessions is newest-first. Filter on that, then flip once so the chart reads
    // left-to-right oldest-to-newest.
    const withJumps = sessions.filter(s => s.jumps.length);
    if (chartRange === 'all') return withJumps.slice().reverse();
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - Number(chartRange));
    const key = todayKey(cutoff);
    return withJumps.filter(s => s.date >= key).reverse();
  }

  function plural(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }

  function shortDate(key) {
    const [, m, d] = key.split('-');
    return `${Number(m)}/${Number(d)}`;
  }

  function renderStats() {
    const withJumps = sessions.filter(s => s.jumps.length);
    const all = withJumps.flatMap(s => s.jumps);
    if (!all.length) { statStrip.innerHTML = ''; return; }

    const best = all.reduce((a, j) => (j.heightCm > a.heightCm ? j : a));
    const recent = withJumps.slice(0, 5).map(sessionMean);
    const recentMean = recent.reduce((a, b) => a + b, 0) / recent.length;

    let trendHtml = '<span class="stat-sub">needs two sessions</span>';
    if (withJumps.length >= 2) {
      const first = sessionMean(withJumps[withJumps.length - 1]);
      const last = sessionMean(withJumps[0]);
      const delta = last - first;
      const sign = delta > 0 ? '+' : '';
      trendHtml = `<span class="stat-sub">${sign}${delta.toFixed(1)} cm since ${shortDate(withJumps[withJumps.length - 1].date)}</span>`;
    }

    statStrip.innerHTML = [
      ['Personal best', `${best.heightCm.toFixed(1)}<span class="unit">cm</span>`, best.date],
      ['Sessions', String(withJumps.length), `${all.length} jumps total`],
      ['Last 5 sessions', `${recentMean.toFixed(1)}<span class="unit">cm</span>`, 'mean of means'],
      ['Trend', trendHtml, '']
    ].map(([label, val, sub]) => `
      <div class="stat">
        <div class="stat-label">${label}</div>
        <div class="stat-val">${val}</div>
        ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
      </div>`).join('');
  }

  function renderChart() {
    const rows = visibleSessions();
    careerChart.innerHTML = `<title id="careerChartTitle">Session mean jump height over time</title>`;
    if (!rows.length) {
      careerSummary.textContent = 'No sessions in this range.';
      careerLegend.textContent = '';
      return;
    }

    const W = 340, H = 180;
    const m = { t: 14, r: 12, b: 26, l: 34 };
    const plotW = W - m.l - m.r, plotH = H - m.t - m.b;

    const vals = rows.map(sessionMean);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 1) { const c = (hi + lo) / 2; lo = c - 0.5; hi = c + 0.5; }
    const pad = (hi - lo) * 0.18;
    lo -= pad; hi += pad;
    const span = hi - lo;

    const n = rows.length;
    const xAt = i => n === 1 ? m.l + plotW / 2 : m.l + (i / (n - 1)) * plotW;
    const yAt = v => m.t + plotH - ((v - lo) / span) * plotH;

    const ns = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs) => {
      const e = document.createElementNS(ns, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    };

    // horizontal grid + y labels
    const ticks = 4;
    for (let t = 0; t <= ticks; t++) {
      const v = lo + (span * t) / ticks;
      const y = yAt(v);
      careerChart.appendChild(el('line', { class: 'grid', x1: m.l, y1: y, x2: W - m.r, y2: y }));
      const lbl = el('text', { class: 'axis', x: m.l - 5, y: y + 3, 'text-anchor': 'end' });
      lbl.textContent = v.toFixed(1);
      careerChart.appendChild(lbl);
    }

    // x labels: first, last, and a middle sample so it stays readable
    const labelIdx = n <= 4 ? rows.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
    labelIdx.forEach(i => {
      const lbl = el('text', {
        class: 'axis', x: xAt(i), y: H - 8,
        'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'
      });
      lbl.textContent = shortDate(rows[i].date);
      careerChart.appendChild(lbl);
    });

    const pts = rows.map((s, i) => [xAt(i), yAt(sessionMean(s))]);
    if (n > 1) {
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      careerChart.appendChild(el('path', { class: 'series-halo', d }));   // dark underlay
      careerChart.appendChild(el('path', { class: 'series', d }));        // hi-vis on top
    }

    // points, with a wider invisible hit target for pointer and keyboard
    rows.forEach((s, i) => {
      const [x, y] = pts[i];
      const isLast = i === n - 1;
      const hit = el('rect', { class: 'bar-hit', x: x - 8, y: m.t, width: 16, height: plotH, tabindex: '0', role: 'button' });
      hit.setAttribute('aria-label', `${s.name}: ${sessionMean(s).toFixed(1)} centimetres from ${plural(s.jumps.length, 'jump')}`);
      careerChart.appendChild(hit);
      careerChart.appendChild(el('circle', { class: 'pt-halo', cx: x, cy: y, r: 5.5 }));
      careerChart.appendChild(el('circle', { class: isLast ? 'pt-latest' : 'pt', cx: x, cy: y, r: 3.5 }));
    });

    const latest = sessionMean(rows[n - 1]);
    const bestRow = rows.reduce((a, s) => (sessionMean(s) > sessionMean(a) ? s : a));
    careerLegend.textContent = `${plural(n, 'session')} · latest ${latest.toFixed(1)} cm · best ${sessionMean(bestRow).toFixed(1)} cm (${bestRow.date})`;

    const first = sessionMean(rows[0]);
    careerSummary.textContent =
      `${plural(n, 'session')} plotted, each point the mean of that day's jumps. ` +
      `Latest ${latest.toFixed(1)} centimetres on ${rows[n - 1].name}. ` +
      `Best ${sessionMean(bestRow).toFixed(1)} centimetres on ${bestRow.name}. ` +
      `Change across the range ${(latest - first >= 0 ? '+' : '')}${(latest - first).toFixed(1)} centimetres.`;
  }

  /* ---- session list ---- */
  function renderList() {
    if (!sessions.length) { sessionList.innerHTML = ''; return; }
    sessionList.innerHTML = sessions.map(s => {
      const m = sessionMean(s);
      const rows = s.jumps.slice().sort((a, b) => b.heightCm - a.heightCm).map(j => `
        <div class="jump-row">
          <button class="jump-row-name jump-open" type="button" data-open-jump="${j.id}" data-session="${s.id}"
                  aria-label="Open jump of ${j.heightCm.toFixed(1)} centimetres from ${escapeHtml(s.name)}">
            ${escapeHtml(j.videoName || 'clip')}
          </button>
          <span class="jump-row-val">${j.heightCm.toFixed(1)} cm</span>
          <span>${j.flightTime.toFixed(3)} s</span>
          <span>${isFinite(j.fps) ? j.fps : '—'} fps</span>
          <button class="icon-btn danger" type="button" data-del-jump="${j.id}" data-session="${s.id}"
                  aria-label="Delete jump ${j.heightCm.toFixed(1)} centimetres from ${escapeHtml(s.name)}">
            <i class="ti ti-trash" aria-hidden="true"></i>
          </button>
        </div>`).join('');
      return `
        <div class="session-row">
          <div class="session-row-head">
            <button class="session-row-main" type="button" data-toggle="${s.id}"
                    aria-expanded="false" aria-label="Show jumps in ${escapeHtml(s.name)}">
              <div class="session-row-date">${escapeHtml(s.name)}</div>
              <div class="session-row-sub">${plural(s.jumps.length, 'jump')}${s.name === s.date ? '' : ' · ' + s.date}</div>
            </button>
            <div class="session-row-mean">${m == null ? '—' : m.toFixed(1) + '<span class="unit">cm</span>'}</div>
            <button class="icon-btn" type="button" data-rename="${s.id}" aria-label="Rename ${escapeHtml(s.name)}">
              <i class="ti ti-pencil" aria-hidden="true"></i>
            </button>
            <button class="icon-btn danger" type="button" data-del-session="${s.id}" aria-label="Delete session ${escapeHtml(s.name)}">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
          <div class="jump-list hidden" id="jumps-${s.id}">${rows || '<div class="session-empty">No jumps saved yet.</div>'}</div>
        </div>`;
    }).join('');
  }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  sessionList.addEventListener('click', e => {
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const box = document.getElementById('jumps-' + toggle.dataset.toggle);
      const open = box.classList.toggle('hidden') === false;
      toggle.setAttribute('aria-expanded', String(open));
      return;
    }
    const rn = e.target.closest('[data-rename]');
    if (rn) {
      const s = sessions.find(x => x.id === rn.dataset.rename);
      if (!s) return;
      const next = prompt('Session name', s.name);
      if (next === null) return;
      if (next.trim()) s.name = next.trim();
      persist(); renderCareer(); renderSessionLabel();
      return;
    }
    const open = e.target.closest('[data-open-jump]');
    if (open) {
      const s = sessions.find(x => x.id === open.dataset.session);
      if (s) viewJump(s, open.dataset.openJump);
      return;
    }
    const dj = e.target.closest('[data-del-jump]');
    if (dj) {
      const s = sessions.find(x => x.id === dj.dataset.session);
      if (!s) return;
      s.jumps = s.jumps.filter(j => j.id !== dj.dataset.delJump);
      // a deleted jump cannot stay on screen
      if (viewed && viewed.jumpId === dj.dataset.delJump) { viewed = null; hideReading(); }
      persist(); renderCareer(); renderSessionLabel();
      return;
    }
    const ds = e.target.closest('[data-del-session]');
    if (ds) {
      const s = sessions.find(x => x.id === ds.dataset.delSession);
      if (!s) return;
      if (!confirm(`Delete "${s.name}" and its ${plural(s.jumps.length, 'jump')}? This cannot be undone.`)) return;
      if (viewed && viewed.sessionId === ds.dataset.delSession) { viewed = null; hideReading(); }
      sessions = sessions.filter(x => x.id !== ds.dataset.delSession);
      if (activeSessionId === ds.dataset.delSession) {
        activeSessionId = null;
        ensureTodaySession();
      }
      persist(); renderCareer(); renderSessionLabel();
    }
  });

  document.querySelectorAll('.range-btn').forEach(b => {
    b.addEventListener('click', () => {
      chartRange = b.dataset.range;
      document.querySelectorAll('.range-btn').forEach(x => x.classList.toggle('active', x === b));
      renderChart();
    });
  });

  function renderCareer() {
    const any = sessions.some(s => s.jumps.length);
    careerEmpty.classList.toggle('hidden', any);
    careerBody.classList.toggle('hidden', !any);
    if (!any) return;
    renderStats();
    renderChart();
    renderList();
  }

  /* ---- export / import ---- */
  document.getElementById('exportData').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ version: STORE_VERSION, exported: new Date().toISOString(), sessions }, null, 2)],
                          { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `jump-history-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  document.getElementById('importData').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const incoming = Array.isArray(data) ? data : data.sessions;
        if (!Array.isArray(incoming)) throw new Error('no sessions array');
        if (data.version && data.version > STORE_VERSION) {
          setNote('That file was written by a newer version of the app.', 'warn');
        }
        // merge by date so an import adds to history instead of replacing it
        incoming.forEach(s => {
          if (!s || typeof s.date !== 'string' || !Array.isArray(s.jumps)) return;
          const existing = sessions.find(x => x.date === s.date);
          if (existing) {
            const have = new Set(existing.jumps.map(j => j.id));
            s.jumps.forEach(j => { if (!have.has(j.id)) existing.jumps.push(j); });
          } else {
            sessions.push({ id: s.id || uid(), date: s.date, name: s.name || s.date, jumps: s.jumps });
          }
        });
        sortSessions();
        persist();
        renderCareer();
        renderSessionLabel();
        setNote(`Imported ${plural(incoming.length, 'session')}.`, 'ok');
      } catch (err) {
        setNote('That file is not a jump-history export.', 'warn');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  /* =========================================================================
     INIT
     ========================================================================= */
  sessions = loadSessions();
  sortSessions();
  ensureTodaySession();
  renderSessionLabel();
  renderCareer();
  renderJumpNav();
  updateFpsUi();
  syncButtons();
  window.__appReady = true;
  </script>
</body>
</html>
