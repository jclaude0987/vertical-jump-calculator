<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jump Height Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Surfaces: warm paper, the wall you chalk-mark. */
      --surface: #f7f7f4;
      --raised: #ffffff;
      --sunken: #efefea;

      /* Content. Contrast measured against --raised and --surface. */
      --ink: #14141a;            /* 18.35:1 on raised */
      --muted: #55555e;          /*  7.38:1 on raised  (was 2.41:1) */

      /* Lines. A boundary that identifies a control must reach 3:1. */
      --line-strong: #767676;    /*  4.54:1 on raised  (was 1.53:1) */
      --hairline: #e4e4df;       /* decorative only, non-text */

      /* The measurement. Hi-vis is a FILL carrying dark ink, never text or a
         hairline: #d8e836 as a line on white is 1.35:1. Ink on it is 13.55:1. */
      --readout: #d8e836;
      --readout-ink: #14141a;   /* pinned in both appearances: hi-vis always carries dark ink */

      --ok: #0f6b3d;             /*  6.58:1 on raised */
      --warn: #8a4b00;           /*  6.80:1 on raised */

      --radius-md: 8px;
      --radius-lg: 12px;
      --tap: 44px;               /* minimum touch target */

      --font-ui: 'Barlow', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-display: 'Barlow Condensed', 'Barlow', -apple-system, system-ui, sans-serif;
      --font-data: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #131316;
        --raised: #1c1c20;
        --sunken: #101013;
        --ink: #f4f4f0;          /* 15.40:1 on raised */
        --muted: #a3a3ad;        /*  6.79:1 on raised  (was 2.64:1) */
        --line-strong: #75757f;  /*  3.73:1 on raised */
        --hairline: #2f2f35;
        --ok: #4ade80;
        --warn: #fbbf24;
        --readout-ink: #14141a;
      }
    }

    /* Increase Contrast: promote the two tokens that were tuned to just pass. */
    @media (prefers-contrast: more) {
      :root { --muted: #3a3a42; --line-strong: #4a4a52; }
    }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
      :root { --muted: #d0d0d8; --line-strong: #9a9aa4; }
    }

    html { font-size: 100%; }

    body {
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.45;
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    }

    .app { width: 100%; max-width: 40rem; }

    /* Visible focus for keyboard and switch users. */
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 1.625rem; font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .new-video-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.375rem;
      min-height: var(--tap); padding: 0.5rem 1rem;
      font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 500;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--raised);
      color: var(--ink); cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .new-video-btn:hover { background: var(--sunken); }
    .new-video-btn i { font-size: 1.125rem; }

    /* New Jump and the jump stepper share one row, under the session bar. */
    .jump-bar {
      display: flex; align-items: center; gap: 0.375rem; margin-bottom: 1rem;
    }
    .jump-nav {
      flex: 1; min-width: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 0.25rem;
      background: var(--raised); border: 1px solid var(--hairline);
      border-radius: var(--radius-lg); padding: 0 0.25rem;
    }
    .jump-nav-label {
      flex: 1; min-width: 0; text-align: center;
      font-family: var(--font-data); font-size: 0.8125rem; font-weight: 600;
      font-variant-numeric: tabular-nums; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-btn {
      width: var(--tap); min-height: var(--tap); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: var(--radius-md);
      color: var(--ink); cursor: pointer;
    }
    .nav-btn:hover:not(:disabled) { background: var(--sunken); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .upload-zone {
      width: 100%;
      border: 2px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
      transition: background-color 0.15s ease;
      background: var(--raised); margin-bottom: 1.25rem;
      font-family: var(--font-ui); color: var(--ink);
    }
    .upload-zone:hover { background: var(--sunken); }
    .upload-zone i { font-size: 2.25rem; color: var(--muted); display: block; margin-bottom: 0.625rem; }
    .upload-zone p { font-size: 0.9375rem; color: var(--muted); line-height: 1.5; }
    .upload-zone strong { color: var(--ink); }
    .upload-hint { margin-top: 0.375rem; font-size: 0.8125rem; }

    .section {
      background: var(--raised);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 1rem 1.125rem;
      margin-bottom: 1rem;
    }

    video {
      width: 100%; border-radius: var(--radius-md); display: block;
      margin-bottom: 0.625rem; background: #000;
      max-height: 22.5rem; object-fit: contain;
    }

    .fps-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .fps-btn {
      flex: 1 1 auto; min-width: 3.75rem; min-height: var(--tap);
      padding: 0.5rem 0.25rem;
      font-family: var(--font-data); font-size: 0.9375rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--raised); border: 1px solid var(--line-strong);
      border-radius: var(--radius-md); cursor: pointer; color: var(--ink);
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .fps-btn:hover:not(:disabled) { background: var(--sunken); }
    .fps-btn.active {
      background: var(--ink); color: var(--raised);
      border-color: var(--ink); font-weight: 700;
    }
    .fps-btn:disabled { cursor: default; }

    .fps-note {
      font-size: 0.8125rem; line-height: 1.45; color: var(--muted);
      min-height: 1.25rem; margin-top: 0.5rem;
    }
    .fps-note.warn { color: var(--warn); }
    .fps-note.ok { color: var(--ok); }

    /* The element box is the hit region. Keep it 44px tall and style only the
       track, so the visible rail stays thin while the target stays reachable. */
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: var(--tap);
      background: transparent; cursor: pointer;
      margin-bottom: 0; display: block;
    }
    input[type=range]:disabled { opacity: 0.45; cursor: default; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px; background: var(--line-strong);
    }
    input[type=range]::-moz-range-track {
      height: 4px; border-radius: 2px; background: var(--line-strong);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      background: var(--ink); border: 2px solid var(--raised);
      margin-top: -0.625rem;
    }
    input[type=range]::-moz-range-thumb {
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      background: var(--ink); border: 2px solid var(--raised);
    }

    .frame-markers {
      display: flex; justify-content: space-between;
      font-family: var(--font-data); font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted); margin-top: 0.125rem;
    }

    .playback-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .play-btn {
      width: var(--tap); height: var(--tap); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); cursor: pointer;
      background: var(--raised); transition: background-color 0.12s ease; flex-shrink: 0;
    }
    .play-btn:hover:not(:disabled) { background: var(--sunken); }
    .play-btn:disabled { opacity: 0.45; cursor: default; }
    .play-btn i { font-size: 1.125rem; color: var(--ink); }
    .frame-counter {
      font-family: var(--font-data); font-size: 0.875rem; font-weight: 600;
      font-variant-numeric: tabular-nums; color: var(--ink);
      margin-left: 0.25rem;
    }
    .step-btn {
      width: var(--tap); height: var(--tap); border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); cursor: pointer;
      background: var(--raised); transition: background-color 0.12s ease; flex-shrink: 0;
    }
    .step-btn:hover:not(:disabled) { background: var(--sunken); }
    .step-btn:disabled { opacity: 0.45; cursor: default; }
    .step-btn i { font-size: 1.125rem; color: var(--ink); }

    .mark-controls { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .mark-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.375rem;
      min-height: var(--tap); padding: 0.5rem 0.75rem;
      font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 500;
      border: 1px solid var(--line-strong); border-radius: var(--radius-md);
      cursor: pointer; background: var(--raised); color: var(--ink);
      transition: background-color 0.12s ease;
    }
    .mark-btn:hover:not(:disabled) { background: var(--sunken); }
    .mark-btn.set { background: var(--ink); color: var(--raised); border-color: var(--ink); }
    .mark-btn:disabled { opacity: 0.45; cursor: default; }
    .mark-btn i { font-size: 1.125rem; }

    .markers-display { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .marker-chip {
      flex: 1; padding: 0.5rem 0.625rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--hairline);
      background: var(--sunken);
    }
    .chip-label {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); font-weight: 600;
    }
    .chip-val {
      font-family: var(--font-data); font-size: 1.125rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .chip-val.unset { color: var(--muted); font-weight: 400; }

    /* ---- The measurement ---------------------------------------------------
       The arc is the result. The reading sits at the apex of the trajectory it
       was derived from, so the number is a position rather than a decoration. */
    .reading {
      position: relative; margin-top: 0.75rem;
      border: 1px solid var(--hairline); border-radius: var(--radius-lg);
      background: var(--sunken); padding: 0.75rem 1rem 1rem;
      overflow: hidden;
    }
    .trajectory { width: 100%; height: 8.5rem; display: block; }
    .trajectory .arc {
      fill: none; stroke: var(--ink); stroke-width: 2;
      stroke-linecap: round; stroke-dasharray: var(--arc-len, 1000);
      stroke-dashoffset: var(--arc-len, 1000);
    }
    .trajectory .base { stroke: var(--line-strong); stroke-width: 1; }
    .trajectory .tick { stroke: var(--line-strong); stroke-width: 1; }
    .trajectory .dim  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .trajectory .marker-dot { fill: var(--ink); }
    .trajectory .lbl {
      font-family: var(--font-data); font-size: 0.6875rem; fill: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .measure-badge {
      position: absolute; left: 50%; top: 0.375rem; transform: translateX(-50%);
      background: var(--readout); color: var(--readout-ink);
      border-radius: 999px; padding: 0.25rem 0.875rem;
      font-family: var(--font-data); font-size: 1.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums; line-height: 1.2;
      white-space: nowrap;
    }
    .measure-badge .unit {
      font-size: 0.8125rem; font-weight: 600; opacity: 0.75; margin-left: 0.125rem;
    }
    .measure-badge.dim { opacity: 0.45; }
    .readout-line {
      margin-top: 0.5rem; text-align: center;
      font-family: var(--font-data); font-size: 0.8125rem;
      font-variant-numeric: tabular-nums; color: var(--muted);
    }
    .readout-line strong { color: var(--ink); font-weight: 600; }

    .calc-bar {
      position: sticky; bottom: 0; z-index: 2;
      padding: 0.75rem 0 calc(0.75rem + env(safe-area-inset-bottom));
      margin-top: 0.5rem;
      /* No backdrop: a gradient to --surface turns into a black slab in dark mode,
         and the bar is stuck at body level so it never overlaps card content. */
    }
    .calc-btn {
      width: 100%; min-height: 3.25rem; padding: 0.875rem;
      font-family: var(--font-ui);
      font-size: 1.0625rem; font-weight: 600;
      background: var(--ink); color: var(--surface);
      border: none; border-radius: var(--radius-md); cursor: pointer;
      transition: opacity 0.12s ease;
    }
    .calc-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .calc-btn:hover:not(:disabled) { opacity: 0.85; }

    .video-filename {
      font-family: var(--font-data); font-size: 0.75rem; color: var(--muted);
      margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---- Dashboards ------------------------------------------------------- */
    .tabs {
      display: flex; gap: 0.25rem; margin-bottom: 1rem;
      background: var(--raised); border: 1px solid var(--hairline);
      border-radius: var(--radius-lg); padding: 0.25rem;
    }
    .tab {
      flex: 1; min-height: var(--tap);
      font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 600;
      background: transparent; color: var(--muted);
      border: none; border-radius: var(--radius-md); cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { background: var(--ink); color: var(--raised); }

    .session-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      background: var(--raised); border: 1px solid var(--hairline);
      border-radius: var(--radius-lg); padding: 0.625rem 1.125rem; margin-bottom: 1rem;
    }
    .session-info { display: flex; flex-direction: column; min-width: 0; }
    .session-label {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); font-weight: 600;
    }
    .session-name {
      font-family: var(--font-data); font-size: 1rem; font-weight: 700;
      color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-edit {
      display: flex; align-items: center; gap: 0.375rem;
      min-height: var(--tap); padding: 0.5rem 0.875rem; flex-shrink: 0;
      font-family: var(--font-ui); font-size: 0.875rem; font-weight: 500;
      background: var(--raised); color: var(--ink);
      border: 1px solid var(--line-strong); border-radius: var(--radius-md); cursor: pointer;
    }
    .session-edit:hover { background: var(--sunken); }

    .save-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.375rem;
      margin-top: 0.75rem; min-height: var(--tap); padding: 0.5rem 0.75rem;
      font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 600;
      background: var(--ink); color: var(--surface);
      border: none; border-radius: var(--radius-md); cursor: pointer;
      transition: opacity 0.12s ease;
    }
    .save-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .save-btn:hover:not(:disabled) { opacity: 0.85; }
    .save-note { font-size: 0.8125rem; color: var(--muted); margin-top: 0.375rem; min-height: 1.25rem; }
    .save-note.ok { color: var(--ok); }
    .save-note.warn { color: var(--warn); }

    .empty-state {
      background: var(--raised); border: 1px solid var(--hairline);
      border-radius: var(--radius-lg); padding: 3rem 1.5rem; text-align: center;
    }
    .empty-state i { font-size: 2.25rem; color: var(--muted); display: block; margin-bottom: 0.625rem; }
    .empty-state p { font-size: 0.9375rem; color: var(--muted); line-height: 1.5; }
    .empty-state strong { color: var(--ink); }
    .empty-hint { margin-top: 0.375rem; font-size: 0.8125rem; }

    .stat-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.625rem; }
    .stat {
      background: var(--sunken); border: 1px solid var(--hairline);
      border-radius: var(--radius-md); padding: 0.625rem 0.75rem;
    }
    .stat-label {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); font-weight: 600;
    }
    .stat-val {
      font-family: var(--font-data); font-size: 1.25rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.2;
    }
    .stat-val .unit { font-size: 0.8125rem; font-weight: 600; opacity: 0.7; margin-left: 0.125rem; }
    .stat-sub { font-size: 0.75rem; color: var(--muted); font-family: var(--font-data); }

    .chart-head, .list-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; margin-bottom: 0.625rem;
    }
    .list-head { flex-wrap: nowrap; }
    .data-actions { display: flex; gap: 0.375rem; flex-shrink: 0; }
    .chart-title { font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 600; color: var(--ink); }
    .range-row { display: flex; gap: 0.25rem; }
    .range-btn {
      min-height: 2.5rem; padding: 0.25rem 0.75rem;
      font-family: var(--font-data); font-size: 0.8125rem; font-weight: 600;
      background: var(--raised); color: var(--muted);
      border: 1px solid var(--line-strong); border-radius: var(--radius-md); cursor: pointer;
    }
    .range-btn:hover { background: var(--sunken); color: var(--ink); }
    .range-btn.active { background: var(--ink); color: var(--raised); border-color: var(--ink); }

    .career-chart { width: 100%; height: 11.25rem; display: block; }
    /* grid rules are decorative; the series itself carries the meaning */
    .career-chart .grid { stroke: var(--hairline); stroke-width: 1; }
    /* SVG text scales with the viewBox, so this is set in user units, not px. */
    .career-chart .axis { font-family: var(--font-data); font-size: 9px; fill: var(--muted); }
    .career-chart .series-halo { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    /* Hi-vis is 1.35:1 on white, so the series is hi-vis over a dark halo. */
    .career-chart .series { fill: none; stroke: var(--readout); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .career-chart .pt-halo { fill: var(--ink); }
    .career-chart .pt { fill: var(--readout); }
    .career-chart .pt-latest { fill: var(--readout); stroke: var(--ink); stroke-width: 2; }
    .career-chart .bar-hit { fill: transparent; cursor: pointer; }
    .career-chart .bar-hit:hover + .pt-halo,
    .career-chart .bar-hit:focus-visible + .pt-halo { fill: var(--readout); }
    .chart-legend {
      font-family: var(--font-data); font-size: 0.75rem; color: var(--muted);
      margin-top: 0.375rem; line-height: 1.5;
    }

    .ghost-btn {
      display: flex; align-items: center; gap: 0.25rem;
      min-height: 2.5rem; padding: 0.25rem 0.625rem;
      font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 500;
      background: var(--raised); color: var(--muted);
      border: 1px solid var(--line-strong); border-radius: var(--radius-md); cursor: pointer;
    }
    .ghost-btn:hover { background: var(--sunken); color: var(--ink); }

    .session-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .session-row {
      border: 1px solid var(--hairline); border-radius: var(--radius-md);
      background: var(--sunken); overflow: hidden;
    }
    .session-row-head {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.625rem;
    }
    .session-row-main { flex: 1; min-width: 0; background: none; border: none; cursor: pointer; text-align: left; color: var(--ink); }
    .session-row-date {
      font-family: var(--font-data); font-size: 0.875rem; font-weight: 700; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-row-sub {
      font-family: var(--font-data); font-size: 0.75rem; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .session-row-mean {
      font-family: var(--font-data); font-size: 1rem; font-weight: 700; color: var(--ink);
      font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0;
    }
    .session-row-mean .unit { font-size: 0.75rem; opacity: 0.7; }
    .icon-btn {
      width: 2.25rem; height: 2.25rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: var(--radius-md);
      color: var(--muted); cursor: pointer;
    }
    .icon-btn:hover { background: var(--raised); color: var(--ink); }
    .icon-btn.danger:hover { color: var(--warn); }
    .jump-list { border-top: 1px solid var(--hairline); }
    .jump-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.375rem 0.625rem; font-family: var(--font-data); font-size: 0.75rem;
      font-variant-numeric: tabular-nums; color: var(--muted);
      border-bottom: 1px solid var(--hairline);
    }
    .jump-row:last-child { border-bottom: none; }
    .jump-row-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    /* the file name is the control that reopens a saved jump */
    .jump-open {
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: inherit; font-size: inherit; text-align: left;
      text-decoration: underline; text-decoration-color: var(--hairline);
      text-underline-offset: 0.15em;
    }
    .jump-open:hover { text-decoration-color: var(--ink); }
    .jump-row-val { color: var(--ink); font-weight: 600; }
    .session-empty { padding: 0.5rem 0.625rem; font-size: 0.75rem; color: var(--muted); font-family: var(--font-ui); }

    .hidden { display: none !important; }

    @media (min-width: 40rem) {
      .stat-strip { grid-template-columns: repeat(4, 1fr); }
    }

    @media (min-width: 40rem) {
      .header h1 { font-size: 1.875rem; }
      .measure-badge { font-size: 1.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trajectory .arc { stroke-dashoffset: 0; }
      * { transition-duration: 0.01ms !important; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .trajectory.animate .arc { animation: trace 0.42s ease-out forwards; }
      @keyframes trace {
        from { stroke-dashoffset: var(--arc-len, 1000); }
        to   { stroke-dashoffset: 0; }
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Jump Height</h1>
    </div>

    <div class="tabs" role="tablist" aria-label="Dashboard">
      <button class="tab" id="tabMeasure" role="tab" aria-selected="true" aria-controls="panelMeasure">Measure</button>
      <button class="tab" id="tabCareer" role="tab" aria-selected="false" aria-controls="panelCareer" tabindex="-1">Career</button>
    </div>

    <div id="panelMeasure" role="tabpanel" aria-labelledby="tabMeasure">

    <button class="upload-zone" id="uploadZone" type="button">
      <i class="ti ti-video" aria-hidden="true"></i>
      <p><strong>Drop video here</strong> or click to browse</p>
      <p class="upload-hint">MP4 · MOV · WebM &nbsp;·&nbsp; frame rate detected automatically</p>
      <input type="file" id="fileInput" accept="video/*" style="display:none">
    </button>

    <div id="mainUI" class="hidden">

      <div class="session-bar">
        <div class="session-info">
          <span class="session-label">Session</span>
          <span class="session-name" id="sessionName">—</span>
        </div>
        <button class="session-edit" id="sessionRename" type="button" aria-label="Rename or change the session date">
          <i class="ti ti-calendar" aria-hidden="true"></i> Change
        </button>
      </div>

      <div class="jump-bar">
        <button class="session-edit" id="newJumpBtn" type="button">
          <i class="ti ti-refresh" aria-hidden="true"></i> New Jump
        </button>
        <div class="jump-nav hidden" id="jumpNav" role="group" aria-label="Saved jumps in this session">
          <button class="nav-btn" id="prevJump" type="button" aria-label="Previous jump">
            <i class="ti ti-chevron-left" aria-hidden="true"></i>
          </button>
          <span class="jump-nav-label" id="jumpNavLabel" role="status" aria-live="polite">—</span>
          <button class="nav-btn" id="nextJump" type="button" aria-label="Next jump">
            <i class="ti ti-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="section">
        <div class="fps-row" id="fpsRow">
          <button class="fps-btn" data-fps="30">30</button>
          <button class="fps-btn" data-fps="60">60</button>
          <button class="fps-btn" data-fps="90">90</button>
          <button class="fps-btn" data-fps="120">120</button>
          <button class="fps-btn" data-fps="240">240</button>
        </div>
        <div class="fps-note" id="fpsNote" role="status" aria-live="polite">Detecting frame rate…</div>
      </div>

      <div class="section">
        <div class="video-filename" id="videoFilename"></div>
        <video id="videoEl" muted playsinline></video>

        <div class="playback-row">
          <button class="play-btn" id="playBtn" aria-label="Play">
            <i class="ti ti-player-play" id="playIcon" aria-hidden="true"></i>
          </button>
          <button class="step-btn" id="prevFrame" aria-label="Previous frame"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
          <button class="step-btn" id="nextFrame" aria-label="Next frame"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
          <span class="frame-counter" id="frameCounter">Frame 0 / 0</span>
        </div>

        <input type="range" id="frameSlider" min="0" max="1000" value="0" step="1" aria-label="Video position in frames">
        <div class="frame-markers" aria-hidden="true"><span>0</span><span id="frameLabelEnd">—</span></div>

        <div class="mark-controls">
          <button class="mark-btn" id="markTakeoff"><i class="ti ti-arrow-up" aria-hidden="true"></i> Mark Takeoff</button>
          <button class="mark-btn" id="markLanding"><i class="ti ti-arrow-down" aria-hidden="true"></i> Mark Landing</button>
        </div>

        <div class="markers-display">
          <div class="marker-chip"><div class="chip-label">Takeoff</div><div class="chip-val unset" id="takeoffVal">—</div></div>
          <div class="marker-chip"><div class="chip-label">Landing</div><div class="chip-val unset" id="landingVal">—</div></div>
          <div class="marker-chip"><div class="chip-label">Frames in air</div><div class="chip-val unset" id="framesInAir">—</div></div>
        </div>

      </div>

      <div class="reading hidden" id="reading">
        <svg class="trajectory" id="trajectory" viewBox="0 0 320 136" preserveAspectRatio="none" role="img" aria-labelledby="trajTitle">
          <title id="trajTitle">Jump trajectory from takeoff to landing</title>
          <line class="base" id="trajBase" x1="0" y1="120" x2="320" y2="120"></line>
          <path class="arc" id="trajArc" d=""></path>
          <line class="dim" id="trajApex" x1="160" y1="120" x2="160" y2="30"></line>
          <circle class="marker-dot" id="trajDotA" cx="16" cy="120" r="3"></circle>
          <circle class="marker-dot" id="trajDotB" cx="304" cy="120" r="3"></circle>
          <text class="lbl" id="trajLblA" x="16" y="132" text-anchor="start">takeoff</text>
          <text class="lbl" id="trajLblB" x="304" y="132" text-anchor="end">landing</text>

        <div class="save-note" id="saveNote" role="status" aria-live="polite"></div>

        <button class="calc-btn" id="calcBtn" disabled>Calculate Jump Height</button>
      </div>

    </div>
    </div>

    <div id="panelCareer" class="hidden" role="tabpanel" aria-labelledby="tabCareer">

      <div class="empty-state" id="careerEmpty">
        <i class="ti ti-chart-line" aria-hidden="true"></i>
        <p><strong>No jumps recorded yet</strong></p>
        <p class="empty-hint">Measure a jump and save it to your session. Its height becomes a point on this graph.</p>
      </div>

      <div id="careerBody" class="hidden">

        <div class="section">
          <div class="stat-strip" id="statStrip"></div>
        </div>

        <div class="section">
          <div class="chart-head">
            <h2 class="chart-title">Jump height over time</h2>
            <div class="range-row" role="group" aria-label="Time range">
              <button class="range-btn active" data-range="all" type="button">All</button>
              <button class="range-btn" data-range="90" type="button">90d</button>
              <button class="range-btn" data-range="30" type="button">30d</button>
            </div>
          </div>
          <svg class="career-chart" id="careerChart" viewBox="0 0 340 180" preserveAspectRatio="none" role="img" aria-labelledby="careerChartTitle">
            <title id="careerChartTitle">Session mean jump height over time</title>
          </svg>
          <p class="chart-summary sr-only" id="careerSummary"></p>
          <p class="chart-legend" id="careerLegend"></p>
        </div>

        <div class="section">
          <div class="list-head">
            <h2 class="chart-title">Sessions</h2>
            <div class="data-actions">
              <button class="ghost-btn" id="exportData" type="button"><i class="ti ti-download" aria-hidden="true"></i> Export</button>
              <button class="ghost-btn" id="importData" type="button"><i class="ti ti-upload" aria-hidden="true"></i> Import</button>
              <input type="file" id="importFile" accept="application/json,.json" style="display:none">
            </div>
