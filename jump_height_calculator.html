<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jump Height Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Surfaces: warm paper, the wall you chalk-mark. */
      --surface: #f7f7f4;
      --raised: #ffffff;
      --sunken: #efefea;

      /* Content. Contrast measured against --raised and --surface. */
      --ink: #14141a;            /* 18.35:1 on raised */
      --muted: #55555e;          /*  7.38:1 on raised  (was 2.41:1) */

      /* Lines. A boundary that identifies a control must reach 3:1. */
      --line-strong: #767676;    /*  4.54:1 on raised  (was 1.53:1) */
      --hairline: #e4e4df;       /* decorative only, non-text */

      /* The measurement. Hi-vis is a FILL carrying dark ink, never text or a
         hairline: #d8e836 as a line on white is 1.35:1. Ink on it is 13.55:1. */
      --readout: #d8e836;
      --readout-ink: #14141a;   /* pinned in both appearances: hi-vis always carries dark ink */

      --ok: #0f6b3d;             /*  6.58:1 on raised */
      --warn: #8a4b00;           /*  6.80:1 on raised */

      --radius-md: 8px;
      --radius-lg: 12px;
      --tap: 44px;               /* minimum touch target */

      --font-ui: 'Barlow', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-display: 'Barlow Condensed', 'Barlow', -apple-system, system-ui, sans-serif;
      --font-data: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #131316;
        --raised: #1c1c20;
        --sunken: #101013;
        --ink: #f4f4f0;          /* 15.40:1 on raised */
        --muted: #a3a3ad;        /*  6.79:1 on raised  (was 2.64:1) */
        --line-strong: #75757f;  /*  3.73:1 on raised */
        --hairline: #2f2f35;
        --ok: #4ade80;
        --warn: #fbbf24;
        --readout-ink: #14141a;
      }
    }

    /* Increase Contrast: promote the two tokens that were tuned to just pass. */
    @media (prefers-contrast: more) {
      :root { --muted: #3a3a42; --line-strong: #4a4a52; }
    }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
      :root { --muted: #d0d0d8; --line-strong: #9a9aa4; }
    }

    html { font-size: 100%; }

    body {
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.45;
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    }

    .app { width: 100%; max-width: 40rem; }

    /* Visible focus for keyboard and switch users. */
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 1.625rem; font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .new-video-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.375rem;
      min-height: var(--tap); padding: 0.5rem 1rem;
      font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 500;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--raised);
      color: var(--ink); cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .new-video-btn:hover { background: var(--sunken); }
    .new-video-btn i { font-size: 1.125rem; }

    .upload-zone {
      width: 100%;
      border: 2px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
      transition: background-color 0.15s ease;
      background: var(--raised); margin-bottom: 1.25rem;
      font-family: var(--font-ui); color: var(--ink);
    }
    .upload-zone:hover { background: var(--sunken); }
    .upload-zone i { font-size: 2.25rem; color: var(--muted); display: block; margin-bottom: 0.625rem; }
    .upload-zone p { font-size: 0.9375rem; color: var(--muted); line-height: 1.5; }
    .upload-zone strong { color: var(--ink); }
    .upload-hint { margin-top: 0.375rem; font-size: 0.8125rem; }

    .section {
      background: var(--raised);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 1rem 1.125rem;
      margin-bottom: 1rem;
    }

    video {
      width: 100%; border-radius: var(--radius-md); display: block;
      margin-bottom: 0.625rem; background: #000;
      max-height: 22.5rem; object-fit: contain;
    }

    .fps-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .fps-btn {
      flex: 1 1 auto; min-width: 3.75rem; min-height: var(--tap);
      padding: 0.5rem 0.25rem;
      font-family: var(--font-data); font-size: 0.9375rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--raised); border: 1px solid var(--line-strong);
      border-radius: var(--radius-md); cursor: pointer; color: var(--ink);
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .fps-btn:hover:not(:disabled) { background: var(--sunken); }
    .fps-btn.active {
      background: var(--ink); color: var(--raised);
      border-color: var(--ink); font-weight: 700;
    }
    .fps-btn:disabled { cursor: default; }

    .fps-note {
      font-size: 0.8125rem; line-height: 1.45; color: var(--muted);
      min-height: 1.25rem; margin-top: 0.5rem;
    }
    .fps-note.warn { color: var(--warn); }
    .fps-note.ok { color: var(--ok); }

    /* The element box is the hit region. Keep it 44px tall and style only the
       track, so the visible rail stays thin while the target stays reachable. */
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: var(--tap);
      background: transparent; cursor: pointer;
      margin-bottom: 0; display: block;
    }
    input[type=range]:disabled { opacity: 0.45; cursor: default; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px; background: var(--line-strong);
    }
    input[type=range]::-moz-range-track {
      height: 4px; border-radius: 2px; background: var(--line-strong);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      background: var(--ink); border: 2px solid var(--raised);
      margin-top: -0.625rem;
    }
    input[type=range]::-moz-range-thumb {
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      background: var(--ink); border: 2px solid var(--raised);
    }

    .frame-markers {
      display: flex; justify-content: space-between;
      font-family: var(--font-data); font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted); margin-top: 0.125rem;
    }

    .playback-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .play-btn {
      width: var(--tap); height: var(--tap); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); cursor: pointer;
      background: var(--raised); transition: background-color 0.12s ease; flex-shrink: 0;
    }
    .play-btn:hover:not(:disabled) { background: var(--sunken); }
    .play-btn:disabled { opacity: 0.45; cursor: default; }
    .play-btn i { font-size: 1.125rem; color: var(--ink); }
    .frame-counter {
      font-family: var(--font-data); font-size: 0.875rem; font-weight: 600;
      font-variant-numeric: tabular-nums; color: var(--ink);
      margin-left: 0.25rem;
    }
    .step-btn {
      width: var(--tap); height: var(--tap); border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); cursor: pointer;
      background: var(--raised); transition: background-color 0.12s ease; flex-shrink: 0;
    }
    .step-btn:hover:not(:disabled) { background: var(--sunken); }
    .step-btn:disabled { opacity: 0.45; cursor: default; }
    .step-btn i { font-size: 1.125rem; color: var(--ink); }

    .mark-controls { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .mark-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.375rem;
      min-height: var(--tap); padding: 0.5rem 0.75rem;
      font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 500;
      border: 1px solid var(--line-strong); border-radius: var(--radius-md);
      cursor: pointer; background: var(--raised); color: var(--ink);
      transition: background-color 0.12s ease;
    }
    .mark-btn:hover:not(:disabled) { background: var(--sunken); }
    .mark-btn.set { background: var(--ink); color: var(--raised); border-color: var(--ink); }
    .mark-btn:disabled { opacity: 0.45; cursor: default; }
    .mark-btn i { font-size: 1.125rem; }

    .markers-display { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .marker-chip {
      flex: 1; padding: 0.5rem 0.625rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--hairline);
      background: var(--sunken);
    }
    .chip-label {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); font-weight: 600;
    }
    .chip-val {
      font-family: var(--font-data); font-size: 1.125rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .chip-val.unset { color: var(--muted); font-weight: 400; }

    /* ---- The measurement ---------------------------------------------------
       The arc is the result. The reading sits at the apex of the trajectory it
       was derived from, so the number is a position rather than a decoration. */
    .reading {
      position: relative; margin-top: 0.75rem;
      border: 1px solid var(--hairline); border-radius: var(--radius-lg);
      background: var(--sunken); padding: 0.75rem 1rem 1rem;
      overflow: hidden;
    }
    .trajectory { width: 100%; height: 8.5rem; display: block; }
    .trajectory .arc {
      fill: none; stroke: var(--ink); stroke-width: 2;
      stroke-linecap: round; stroke-dasharray: var(--arc-len, 1000);
      stroke-dashoffset: var(--arc-len, 1000);
    }
    .trajectory .base { stroke: var(--line-strong); stroke-width: 1; }
    .trajectory .tick { stroke: var(--line-strong); stroke-width: 1; }
    .trajectory .dim  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .trajectory .marker-dot { fill: var(--ink); }
    .trajectory .lbl {
      font-family: var(--font-data); font-size: 0.6875rem; fill: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .measure-badge {
      position: absolute; left: 50%; top: 0.375rem; transform: translateX(-50%);
      background: var(--readout); color: var(--readout-ink);
      border-radius: 999px; padding: 0.25rem 0.875rem;
      font-family: var(--font-data); font-size: 1.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums; line-height: 1.2;
      white-space: nowrap;
    }
    .measure-badge .unit {
      font-size: 0.8125rem; font-weight: 600; opacity: 0.75; margin-left: 0.125rem;
    }
    .measure-badge.dim { opacity: 0.45; }
    .readout-line {
      margin-top: 0.5rem; text-align: center;
      font-family: var(--font-data); font-size: 0.8125rem;
      font-variant-numeric: tabular-nums; color: var(--muted);
    }
    .readout-line strong { color: var(--ink); font-weight: 600; }

    .calc-bar {
      position: sticky; bottom: 0; z-index: 2;
      padding: 0.75rem 0 calc(0.75rem + env(safe-area-inset-bottom));
      margin-top: 0.5rem;
      /* No backdrop: a gradient to --surface turns into a black slab in dark mode,
         and the bar is stuck at body level so it never overlaps card content. */
    }
    .calc-btn {
      width: 100%; min-height: 3.25rem; padding: 0.875rem;
      font-family: var(--font-ui);
      font-size: 1.0625rem; font-weight: 600;
      background: var(--ink); color: var(--surface);
      border: none; border-radius: var(--radius-md); cursor: pointer;
      transition: opacity 0.12s ease;
    }
    .calc-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .calc-btn:hover:not(:disabled) { opacity: 0.85; }

    .video-filename {
      font-family: var(--font-data); font-size: 0.75rem; color: var(--muted);
      margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .hidden { display: none !important; }

    @media (min-width: 40rem) {
      .header h1 { font-size: 1.875rem; }
      .measure-badge { font-size: 1.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trajectory .arc { stroke-dashoffset: 0; }
      * { transition-duration: 0.01ms !important; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .trajectory.animate .arc { animation: trace 0.42s ease-out forwards; }
      @keyframes trace {
        from { stroke-dashoffset: var(--arc-len, 1000); }
        to   { stroke-dashoffset: 0; }
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Jump Height</h1>
      <button class="new-video-btn hidden" id="newVideoBtn">
        <i class="ti ti-refresh" aria-hidden="true"></i> New Video
      </button>
    </div>

    <button class="upload-zone" id="uploadZone" type="button">
      <i class="ti ti-video" aria-hidden="true"></i>
      <p><strong>Drop video here</strong> or click to browse</p>
      <p class="upload-hint">MP4 · MOV · WebM &nbsp;·&nbsp; frame rate detected automatically</p>
      <input type="file" id="fileInput" accept="video/*" style="display:none">
    </button>

    <div id="mainUI" class="hidden">

      <div class="section">
        <div class="fps-row" id="fpsRow">
          <button class="fps-btn" data-fps="30">30</button>
          <button class="fps-btn" data-fps="60">60</button>
          <button class="fps-btn" data-fps="90">90</button>
          <button class="fps-btn" data-fps="120">120</button>
          <button class="fps-btn" data-fps="240">240</button>
        </div>
        <div class="fps-note" id="fpsNote" role="status" aria-live="polite">Detecting frame rate…</div>
      </div>

      <div class="section">
        <div class="video-filename" id="videoFilename"></div>
        <video id="videoEl" muted playsinline></video>

        <div class="playback-row">
          <button class="play-btn" id="playBtn" aria-label="Play">
            <i class="ti ti-player-play" id="playIcon" aria-hidden="true"></i>
          </button>
          <button class="step-btn" id="prevFrame" aria-label="Previous frame"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
          <button class="step-btn" id="nextFrame" aria-label="Next frame"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
          <span class="frame-counter" id="frameCounter">Frame 0 / 0</span>
        </div>

        <input type="range" id="frameSlider" min="0" max="1000" value="0" step="1" aria-label="Video position in frames">
        <div class="frame-markers" aria-hidden="true"><span>0</span><span id="frameLabelEnd">—</span></div>

        <div class="mark-controls">
          <button class="mark-btn" id="markTakeoff"><i class="ti ti-arrow-up" aria-hidden="true"></i> Mark Takeoff</button>
          <button class="mark-btn" id="markLanding"><i class="ti ti-arrow-down" aria-hidden="true"></i> Mark Landing</button>
        </div>

        <div class="markers-display">
          <div class="marker-chip"><div class="chip-label">Takeoff</div><div class="chip-val unset" id="takeoffVal">—</div></div>
          <div class="marker-chip"><div class="chip-label">Landing</div><div class="chip-val unset" id="landingVal">—</div></div>
          <div class="marker-chip"><div class="chip-label">Frames in air</div><div class="chip-val unset" id="framesInAir">—</div></div>
        </div>

      </div>

      <div class="reading hidden" id="reading">
        <svg class="trajectory" id="trajectory" viewBox="0 0 320 136" preserveAspectRatio="none" role="img" aria-labelledby="trajTitle">
          <title id="trajTitle">Jump trajectory from takeoff to landing</title>
          <line class="base" id="trajBase" x1="0" y1="120" x2="320" y2="120"></line>
          <path class="arc" id="trajArc" d=""></path>
          <line class="dim" id="trajApex" x1="160" y1="120" x2="160" y2="30"></line>
          <circle class="marker-dot" id="trajDotA" cx="16" cy="120" r="3"></circle>
          <circle class="marker-dot" id="trajDotB" cx="304" cy="120" r="3"></circle>
          <text class="lbl" id="trajLblA" x="16" y="132" text-anchor="start">takeoff</text>
          <text class="lbl" id="trajLblB" x="304" y="132" text-anchor="end">landing</text>
        </svg>
        <div class="measure-badge" id="measureBadge">—<span class="unit">cm</span></div>
        <div class="readout-line" id="readoutLine"></div>
      </div>

      <div class="calc-bar">
        <button class="calc-btn" id="calcBtn" disabled>Calculate Jump Height</button>
      </div>

    </div>
  </div>
  <script>
  'use strict';

  /* =========================================================================
     DOM REFERENCES
     ========================================================================= */
  const uploadZone   = document.getElementById('uploadZone');
  const fileInput    = document.getElementById('fileInput');
  const mainUI       = document.getElementById('mainUI');
  const newVideoBtn  = document.getElementById('newVideoBtn');
  const videoEl      = document.getElementById('videoEl');
  const playBtn      = document.getElementById('playBtn');
  const playIcon     = document.getElementById('playIcon');
  const frameSlider  = document.getElementById('frameSlider');
  const frameCounter = document.getElementById('frameCounter');
  const frameLabelEnd = document.getElementById('frameLabelEnd');
  const markTakeoffBtn = document.getElementById('markTakeoff');
  const markLandingBtn = document.getElementById('markLanding');
  const takeoffVal   = document.getElementById('takeoffVal');
  const landingVal   = document.getElementById('landingVal');
  const framesInAir  = document.getElementById('framesInAir');
  const calcBtn      = document.getElementById('calcBtn');
  const reading      = document.getElementById('reading');
  const trajectory   = document.getElementById('trajectory');
  const trajArc      = document.getElementById('trajArc');
  const trajBase     = document.getElementById('trajBase');
  const trajApex     = document.getElementById('trajApex');
  const trajDotA     = document.getElementById('trajDotA');
  const trajDotB     = document.getElementById('trajDotB');
  const trajLblA     = document.getElementById('trajLblA');
  const trajLblB     = document.getElementById('trajLblB');
  const measureBadge = document.getElementById('measureBadge');
  const readoutLine  = document.getElementById('readoutLine');
  const videoFilename = document.getElementById('videoFilename');
  const fpsRow       = document.getElementById('fpsRow');
  const fpsNote      = document.getElementById('fpsNote');

  /* =========================================================================
     STATE
     ========================================================================= */
  let fps = null;                 // resolved frame rate, null until known
  let fpsSource = null;           // 'container' | 'playback' | 'manual'
  let detectionDone = false;      // has an attempt to resolve fps finished?
  let totalFrames = 0;
  // Markers are stored as media TIME (fps-independent) and derived into frame
  // indices, so changing the frame rate re-quantises them instead of destroying them.
  let takeoffTime = null;
  let landingTime = null;
  let takeoffFrame = null;
  let landingFrame = null;
  let isPlaying = false;
  let rafId = null;
  let sliderDragging = false;
  let objectURL = null;
  let loadToken = 0;              // invalidates async work when a new video loads

  /* =========================================================================
     TIMELINE  (frame index <-> media time)
     ========================================================================= */
  function clampFrame(f) { return Math.max(0, Math.min(f, Math.max(0, totalFrames - 1))); }
  function currentFrame() { return fps ? Math.round(videoEl.currentTime * fps) : 0; }
  function frameToTime(f) { return fps ? f / fps : 0; }

  function recomputeTimeline() {
    if (fps == null || !isFinite(videoEl.duration) || videoEl.duration <= 0) return;
    // NOTE: intentionally duration * fps rather than the container sample count.
    // Real iPhone files carry PTS offsets and discontinuities, so the sample count
    // does not map onto the 0..duration timeline this slider indexes.
    totalFrames = Math.max(1, Math.floor(videoEl.duration * fps));
    frameSlider.max = String(totalFrames - 1);
    frameLabelEnd.textContent = String(totalFrames - 1);
    const cur = Math.min(parseInt(frameSlider.value, 10) || 0, totalFrames - 1);
    frameSlider.value = String(cur);
    seekToFrame(cur);
    renderMarkers();
  }

  function seekToFrame(f) {
    if (fps == null) return;
    f = clampFrame(f);
    videoEl.currentTime = frameToTime(f);
    frameSlider.value = String(f);
    updateCounter();
  }

  function updateCounter() {
    if (fps == null || !totalFrames) { frameCounter.textContent = 'Frame — / —'; return; }
    const f = Math.min(currentFrame(), totalFrames - 1);
    frameCounter.textContent = `Frame ${f} / ${totalFrames - 1}`;
  }

  /* =========================================================================
     FRAME RATE SELECTION
     ========================================================================= */
  const PRESETS = [23.976, 24, 25, 29.97, 30, 50, 59.94, 60, 90, 100, 119.88, 120, 200, 240];

  function fpsLabel(v) { return (Math.round(v * 1000) / 1000).toString(); }

  function snapToPreset(v) {
    let best = null, bestErr = Infinity;
    for (const p of PRESETS) {
      const err = Math.abs(p - v) / p;
      if (err < bestErr) { bestErr = err; best = p; }
    }
    return bestErr <= 0.02 ? best : null;
  }

  function updateFpsUi() {
    fpsRow.querySelectorAll('.fps-btn.dynamic').forEach(b => b.remove());
    let matched = null;
    fpsRow.querySelectorAll('.fps-btn').forEach(b => {
      const v = parseFloat(b.dataset.fps);
      const on = fps != null && Math.abs(v - fps) < 0.05;
      b.classList.toggle('active', on);
      if (on) matched = b;
    });
    if (fps != null && !matched) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fps-btn dynamic active';
      b.dataset.fps = String(fps);
      b.textContent = fpsLabel(fps) + ' fps';
      fpsRow.appendChild(b);
    }
    fpsNote.className = 'fps-note';
    if (fps == null && !detectionDone) {
      fpsNote.textContent = 'Detecting frame rate…';
    } else if (fps == null) {
      fpsNote.textContent = "Couldn't detect the frame rate — select it manually.";
      fpsNote.classList.add('warn');
    } else if (fpsSource === 'container') {
      fpsNote.textContent = `Detected ${fpsLabel(fps)} fps from the video file. Change it if that's wrong.`;
      fpsNote.classList.add('ok');
    } else if (fpsSource === 'playback') {
      fpsNote.textContent = `Measured ${fpsLabel(fps)} fps by playing the video. Change it if that's wrong.`;
    } else {
      fpsNote.textContent = '';
    }
  }

  function setFps(value, source) {
    fps = value;
    fpsSource = source;
    updateFpsUi();
    if (videoEl.src && isFinite(videoEl.duration)) recomputeTimeline();
    syncButtons();
  }

  // Delegated so the dynamically-added detected-rate button works too.
  fpsRow.addEventListener('click', e => {
    const btn = e.target.closest('.fps-btn');
    if (!btn || btn.disabled) return;
    const value = parseFloat(btn.dataset.fps);
    if (!isFinite(value) || value <= 0) return;
    setFps(value, 'manual');
  });

  /* =========================================================================
     MARKERS
     ========================================================================= */
  function setChip(el, value) {
    if (value == null) { el.textContent = '—'; el.classList.add('unset'); }
    else { el.textContent = String(value); el.classList.remove('unset'); }
  }

  function hasValidMarks() {
    return takeoffFrame != null && landingFrame != null && (landingFrame - takeoffFrame) > 0;
  }

  function renderMarkers() {
    takeoffFrame = takeoffTime == null || fps == null
      ? null : clampFrame(Math.round(takeoffTime * fps));
    landingFrame = landingTime == null || fps == null
      ? null : clampFrame(Math.round(landingTime * fps));
    setChip(takeoffVal, takeoffFrame);
    setChip(landingVal, landingFrame);
    const diff = (takeoffFrame != null && landingFrame != null) ? landingFrame - takeoffFrame : null;
    if (diff != null && diff > 0) {
      framesInAir.textContent = String(diff);
      framesInAir.classList.remove('unset');
    } else {
      framesInAir.textContent = diff != null ? 'err' : '—';
      framesInAir.classList.add('unset');
    }
    markTakeoffBtn.classList.toggle('set', takeoffFrame != null);
    markLandingBtn.classList.toggle('set', landingFrame != null);
    hideReading();                         // any marker change invalidates shown results
    syncButtons();
  }

  function resetMarkers() {
    takeoffTime = null; landingTime = null;
    hideReading();
    renderMarkers();
  }

  function syncButtons() {
    const ready = fps != null && videoEl.src !== '' && totalFrames > 0;
    // Playback stays available even before the frame rate is known, so the user can
    // still watch the clip while deciding; only frame-indexed controls are gated.
    playBtn.disabled = videoEl.src === '';
    frameSlider.disabled = !ready;
    document.getElementById('prevFrame').disabled = !ready;
    document.getElementById('nextFrame').disabled = !ready;
    markTakeoffBtn.disabled = !ready;
    markLandingBtn.disabled = !ready;
    calcBtn.disabled = !ready || !hasValidMarks();
  }

  /* =========================================================================
     VIDEO LOADING
     ========================================================================= */
  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = '#888'; });
  uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.style.borderColor = '';
    if (e.dataTransfer.files[0]) loadVideo(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadVideo(e.target.files[0]); });

  newVideoBtn.addEventListener('click', () => {
    if (isPlaying) stopPlayback();
    loadToken++;
    if (objectURL) { URL.revokeObjectURL(objectURL); objectURL = null; }
    videoEl.removeAttribute('src');
    videoEl.load();
    fileInput.value = '';
    mainUI.classList.add('hidden');
    uploadZone.classList.remove('hidden');
    newVideoBtn.classList.add('hidden');
    videoFilename.textContent = '';
    detectionDone = false;
    fps = null; fpsSource = null; totalFrames = 0;
    fpsNote.className = 'fps-note';
    fpsNote.textContent = 'Detecting frame rate…';
    updateFpsUi();
    resetMarkers();
  });

  async function loadVideo(file) {
    const token = ++loadToken;
    detectionDone = false;
    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(file);
    videoEl.src = objectURL;
    videoEl.load();
    videoFilename.textContent = file.name;
    fps = null; fpsSource = null; totalFrames = 0;
    updateFpsUi();
    resetMarkers();
    syncButtons();

    const ok = await new Promise(resolve => {
      const done = () => resolve(true);
      videoEl.addEventListener('loadedmetadata', done, { once: true });
      videoEl.addEventListener('error', () => resolve(false), { once: true });
      setTimeout(() => resolve(videoEl.readyState >= 1), 8000);
    });
    if (token !== loadToken) return;
    if (!ok || !isFinite(videoEl.duration)) {
      fpsNote.className = 'fps-note warn';
      fpsNote.textContent = 'Could not read this video file.';
      return;
    }

    mainUI.classList.remove('hidden');
    uploadZone.classList.add('hidden');
    newVideoBtn.classList.remove('hidden');

    const resolved = await resolveFrameRate(file, token);
    if (token !== loadToken) return;
    detectionDone = true;
    if (resolved) setFps(resolved.fps, resolved.source);
    else { fps = null; fpsSource = null; updateFpsUi(); syncButtons(); }
  }

  async function resolveFrameRate(file, token) {
    try {
      const info = await probeContainer(file);
      if (token !== loadToken) return null;
      if (info && info.fps > 0) {
        const snapped = snapToPreset(info.fps) || info.fps;
        console.debug('[fps] container', info.fps, '->', snapped, info);
        return { fps: snapped, source: 'container' };
      }
    } catch (e) { console.debug('[fps] container probe failed', e); }

    try {
      const measured = await measureFps();
      if (token !== loadToken) return null;
      if (measured) {
        console.debug('[fps] measured', measured);
        return { fps: measured, source: 'playback' };
      }
    } catch (e) { console.debug('[fps] measurement failed', e); }
    return null;
  }

  /* =========================================================================
     FPS DETECTION (BEGIN) — pure functions, no DOM access
     ========================================================================= */

  function u8str(u8, off, len) {
    let s = '';
    for (let i = 0; i < len; i++) s += String.fromCharCode(u8[off + i]);
    return s;
  }
  function dvstr(dv, off, len) { return u8str(new Uint8Array(dv.buffer, dv.byteOffset + off, len), 0, len); }

  async function readBoxHeaderAt(file, off) {
    const u8 = new Uint8Array(await file.slice(off, off + 16).arrayBuffer());
    if (u8.length < 8) return null;
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let size = dv.getUint32(0);
    const type = u8str(u8, 4, 4);
    let headerSize = 8;
    if (size === 1) {
      if (u8.length < 16) return null;
      size = dv.getUint32(8) * 4294967296 + dv.getUint32(12);
      headerSize = 16;
    } else if (size === 0) {
      size = file.size - off;
    }
    return { size, type, headerSize };
  }

  // Walk top-level boxes by header only. Boxes such as mdat are skipped by offset,
  // so a moov at the end of the file costs a handful of small reads, not a full scan.
  async function findTopLevelBox(file, type) {
    let off = 0, guard = 0;
    while (off + 8 <= file.size && guard++ < 128) {
      const h = await readBoxHeaderAt(file, off);
      if (!h || h.size < h.headerSize) return null;
      if (h.type === type) {
        return { start: off, headerSize: h.headerSize, end: Math.min(off + h.size, file.size) };
      }
      off += h.size;
    }
    return null;
  }

  function readBoxes(dv, start, end) {
    const boxes = [];
    let off = start;
    while (off + 8 <= end) {
      let size = dv.getUint32(off);
      const type = dvstr(dv, off + 4, 4);
      let headerSize = 8;
      if (size === 1) {
        if (off + 16 > end) break;
        size = dv.getUint32(off + 8) * 4294967296 + dv.getUint32(off + 12);
        headerSize = 16;
      } else if (size === 0) {
        size = end - off;
      }
      if (size < headerSize) break;
      if (off + size > end) size = end - off;   // tolerate a truncated tail box
      boxes.push({ type, start: off, headerSize, end: off + size });
      off += size;
    }
    return boxes;
  }

  function childBox(dv, box, type) {
    return readBoxes(dv, box.start + box.headerSize, box.end).find(b => b.type === type) || null;
  }

  function readMdhdTimescale(dv, mdhd) {
    const b = mdhd.start + mdhd.headerSize;
    const version = dv.getUint8(b);
    return version === 1 ? dv.getUint32(b + 20) : dv.getUint32(b + 12);
  }

  // Returns the total media duration covered by the video samples plus their count.
  // Summing stts is what makes this robust: these files routinely contain PTS
  // offsets and discontinuities that corrupt a duration/frameCount estimate.
  function readStts(dv, stts) {
    const b = stts.start + stts.headerSize;
    const entries = dv.getUint32(b + 4);
    const list = [];
    let samples = 0, totalDuration = 0;
    for (let i = 0; i < entries; i++) {
      const p = b + 8 + i * 8;
      if (p + 8 > stts.end) break;
      const count = dv.getUint32(p);
      const delta = dv.getUint32(p + 4);
      list.push({ count, delta });
      samples += count;
      totalDuration += count * delta;
    }
    return { entries, samples, totalDuration, list };
  }

  async function parseMp4(file) {
    const moov = await findTopLevelBox(file, 'moov');
    if (!moov) return null;
    const dv = new DataView(await file.slice(moov.start + moov.headerSize, moov.end).arrayBuffer());
    for (const trak of readBoxes(dv, 0, dv.byteLength).filter(b => b.type === 'trak')) {
      const mdia = childBox(dv, trak, 'mdia'); if (!mdia) continue;
      const hdlr = childBox(dv, mdia, 'hdlr');
      if (!hdlr) continue;
      // hdlr layout: version/flags (4) + pre_defined (4) + handler_type (4)
      if (dvstr(dv, hdlr.start + hdlr.headerSize + 8, 4) !== 'vide') continue;
      const mdhd = childBox(dv, mdia, 'mdhd'); if (!mdhd) continue;
      const minf = childBox(dv, mdia, 'minf'); if (!minf) continue;
      const stbl = childBox(dv, minf, 'stbl'); if (!stbl) continue;
      const stts = childBox(dv, stbl, 'stts'); if (!stts) continue;
      const timescale = readMdhdTimescale(dv, mdhd);
      if (!timescale) continue;
      const { samples, totalDuration, list } = readStts(dv, stts);
      if (!samples || !totalDuration || !list.length) continue;
      let sampleCount = samples;
      const stsz = childBox(dv, stbl, 'stsz');
      if (stsz) {
        const c = dv.getUint32(stsz.start + stsz.headerSize + 8);
        if (c) sampleCount = c;
      }
      // Use the interval the samples actually use. Summing the whole stts folds in rare
      // long gaps from paused or edited recordings; on the real iPhone clips in this
      // project that dragged the result to 29.22 fps when the true interval is 30.
      // Counts must be aggregated BY DELTA VALUE, not per stts entry: these files split
      // a uniform 30fps stream across ~25 entries, so no single entry dominates.
      // Only fall back to a duration-weighted average when no one interval dominates,
      // which means a genuinely variable-frame-rate file with no single correct answer.
      const byDelta = new Map();
      for (const e of list) byDelta.set(e.delta, (byDelta.get(e.delta) || 0) + e.count);
      let bestDelta = 0, bestCount = 0;
      for (const [delta, count] of byDelta) if (count > bestCount) { bestCount = count; bestDelta = delta; }
      const vfr = (bestCount / samples) < 0.9;
      return {
        fps: vfr ? (samples * timescale / totalDuration) : (timescale / bestDelta),
        container: 'mp4',
        timescale,
        frameCount: sampleCount,
        vfr
      };
    }
    return null;
  }

  function ebmlID(dv, off) {
    const first = dv.getUint8(off);
    if (!first) return null;
    let len = 1;
    for (let m = 0x80; m; m >>= 1, len++) if (first & m) break;
    if (len > 8 || off + len > dv.byteLength) return null;
    let id = 0;
    for (let i = 0; i < len; i++) id = id * 256 + dv.getUint8(off + i);
    return { id, len };
  }

  function ebmlSize(dv, off) {
    const first = dv.getUint8(off);
    if (!first) return null;
    let len = 1;
    for (let m = 0x80; m; m >>= 1, len++) if (first & m) break;
    if (len > 8 || off + len > dv.byteLength) return null;
    let value = first & (0xFF >> len);
    for (let i = 1; i < len; i++) value = value * 256 + dv.getUint8(off + i);
    return { value, len };
  }

  function ebmlFirstChild(dv, start, end, wantId) {
    let off = start;
    while (off < end) {
      const id = ebmlID(dv, off); if (!id) return null;
      const sz = ebmlSize(dv, off + id.len); if (!sz) return null;
      const bodyStart = off + id.len + sz.len;
      const bodyEnd = Math.min(bodyStart + sz.value, end);
      if (id.id === wantId) return { start: bodyStart, end: bodyEnd };
      if (bodyEnd <= off) return null;
      off = bodyEnd;
    }
    return null;
  }

  async function parseWebm(file) {
    const limit = Math.min(file.size, 2 * 1024 * 1024);
    const u8 = new Uint8Array(await file.slice(0, limit).arrayBuffer());
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const segment = ebmlFirstChild(dv, 0, dv.byteLength, 0x18538067); if (!segment) return null;
    const tracks = ebmlFirstChild(dv, segment.start, segment.end, 0x1654AE6B); if (!tracks) return null;
    let off = tracks.start;
    while (off < tracks.end) {
      const id = ebmlID(dv, off); if (!id) break;
      const sz = ebmlSize(dv, off + id.len); if (!sz) break;
      const bodyStart = off + id.len + sz.len;
      const bodyEnd = Math.min(bodyStart + sz.value, tracks.end);
      if (id.id === 0xAE) {
        const trackType = ebmlFirstChild(dv, bodyStart, bodyEnd, 0x83);
        const isVideo = trackType && (trackType.end - trackType.start) >= 1 && dv.getUint8(trackType.start) === 1;
        if (isVideo) {
          const video = ebmlFirstChild(dv, bodyStart, bodyEnd, 0xE0);
          if (video) {
            const dd = ebmlFirstChild(dv, video.start, video.end, 0x23E383);
            if (dd) {
              let ns = 0;
              for (let i = dd.start; i < dd.end; i++) ns = ns * 256 + dv.getUint8(i);
              if (ns > 0) return { fps: 1e9 / ns, container: 'webm', frameCount: null, vfr: false };
            }
          }
        }
      }
      if (bodyEnd <= off) break;
      off = bodyEnd;
    }
    return null;
  }

  async function probeContainer(file) {
    try {
      const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
      if (head.length >= 12 && u8str(head, 4, 4) === 'ftyp') return await parseMp4(file);
      if (head.length >= 4 && head[0] === 0x1a && head[1] === 0x45 && head[2] === 0xdf && head[3] === 0xa3) {
        return await parseWebm(file);
      }
      // QuickTime/ISO files without an ftyp first (moov/mdat/wide/free/skip/pnot)
      if (head.length >= 8) {
        const t = u8str(head, 4, 4);
        if (t === 'moov' || t === 'mdat' || t === 'wide' || t === 'free' || t === 'skip' || t === 'pnot') {
          return await parseMp4(file);
        }
      }
    } catch (e) { console.debug('[fps] probe error', e); }
    return null;
  }
  /* ===== FPS DETECTION (END) ===== */

  /* =========================================================================
     FPS MEASUREMENT (fallback: play the video and time the presented frames)
     ========================================================================= */
  function frameReady(timeout = 30) {
    return new Promise(resolve => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      if (typeof videoEl.requestVideoFrameCallback === 'function') {
        try { videoEl.requestVideoFrameCallback(finish); } catch (e) { /* ignore */ }
      } else {
        requestAnimationFrame(() => requestAnimationFrame(finish));
      }
      setTimeout(finish, timeout);
    });
  }

  function estimateRefreshRate() {
    return new Promise(resolve => {
      let n = 0, first = 0, last = 0;
      const step = t => {
        if (n === 0) first = t;
        last = t; n++;
        if (n >= 12) {
          const dt = last - first;
          resolve(dt > 0 ? (n - 1) / (dt / 1000) : 0);
          return;
        }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  // The presented frame rate is capped by the display refresh rate, so a 240fps
  // clip on a 60Hz screen measures ~60. That is a confident wrong answer, not a
  // failure, so results at the ceiling are rejected rather than trusted.
  async function measureFps() {
    if (typeof videoEl.requestVideoFrameCallback !== 'function') return null;
    const refresh = await estimateRefreshRate();
    if (!(refresh >= 24)) return null;               // implausible -> cannot judge the ceiling
    const savedTime = videoEl.currentTime;
    const savedMuted = videoEl.muted;
    const restore = () => {
      try { videoEl.pause(); } catch (e) { /* ignore */ }
      videoEl.muted = savedMuted;
      try { videoEl.currentTime = savedTime; } catch (e) { /* ignore */ }
    };
    videoEl.muted = true;
    const intervals = [];
    let prev = null;
    try {
      await videoEl.play();
    } catch (e) { videoEl.muted = savedMuted; return null; }

    await new Promise(resolve => {
      let settled = false;
      const done = () => { if (!settled) { settled = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(done, 3000);
      const tick = (now, meta) => {
        if (prev && meta.mediaTime > prev.mediaTime) {
          const frames = Math.max(1, meta.presentedFrames - prev.presentedFrames);
          const interval = (meta.mediaTime - prev.mediaTime) / frames;
          if (interval > 0.0005 && interval < 0.2) intervals.push(interval);
          if (intervals.length >= 45) { done(); return; }
        }
        prev = meta;
        if (videoEl.ended) { done(); return; }
        try { videoEl.requestVideoFrameCallback(tick); } catch (e) { done(); }
      };
      try { videoEl.requestVideoFrameCallback(tick); } catch (e) { done(); }
    });

    restore();
    if (intervals.length < 8) return null;
    intervals.sort((a, b) => a - b);
    const median = intervals[intervals.length >> 1];
    const measured = 1 / median;
    if (!isFinite(measured) || measured <= 0) return null;
    if (measured >= refresh * 0.95) return null;     // at the display ceiling -> ambiguous
    return snapToPreset(measured) || measured;
  }

  /* =========================================================================
     PLAYBACK
     ========================================================================= */
  playBtn.addEventListener('click', togglePlay);

  function togglePlay() { isPlaying ? stopPlayback() : startPlayback(); }

  function startPlayback() {
    videoEl.play().then(() => { isPlaying = true; }).catch(() => {});
    playIcon.className = 'ti ti-player-pause';
    rafId = requestAnimationFrame(rafLoop);
  }

  function stopPlayback() {
    videoEl.pause(); isPlaying = false;
    playIcon.className = 'ti ti-player-play';
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function rafLoop() {
    if (isPlaying) {
      if (!sliderDragging && fps != null) {
        frameSlider.value = String(Math.min(currentFrame(), Math.max(0, totalFrames - 1)));
        updateCounter();
          }
      if (videoEl.ended) { stopPlayback(); return; }
      rafId = requestAnimationFrame(rafLoop);
    }
  }

  videoEl.addEventListener('ended', stopPlayback);

  frameSlider.addEventListener('input', () => { sliderDragging = true; seekToFrame(parseInt(frameSlider.value, 10)); });
  frameSlider.addEventListener('change', () => { sliderDragging = false; });
  document.getElementById('prevFrame').addEventListener('click', () => { if (isPlaying) stopPlayback(); seekToFrame(currentFrame() - 1); });
  document.getElementById('nextFrame').addEventListener('click', () => { if (isPlaying) stopPlayback(); seekToFrame(currentFrame() + 1); });

  /* =========================================================================
     MARKING
     ========================================================================= */
  markTakeoffBtn.addEventListener('click', () => {
    if (fps == null) return;
    takeoffTime = frameToTime(currentFrame());
    renderMarkers();
  });

  markLandingBtn.addEventListener('click', () => {
    if (fps == null) return;
    landingTime = frameToTime(currentFrame());
    renderMarkers();
  });

  /* =========================================================================
     CALCULATION AND THE READING
     ========================================================================= */
  calcBtn.addEventListener('click', () => {
    if (takeoffFrame == null || landingFrame == null) return;
    const frames = landingFrame - takeoffFrame;
    const t = frames / fps;
    const halfT = t / 2;
    const d = 0.5 * 9.81 * halfT * halfT;   // metres; matches the force-plate JH-2 definition
    showReading(t, frames, d);
  });

  function hideReading() { reading.classList.add('hidden'); }

  function showReading(t, frames, metres) {
    const cm = metres * 100;
    const inches = metres * 39.3701;
    measureBadge.innerHTML = `${cm.toFixed(1)}<span class="unit">cm</span>`;
    measureBadge.setAttribute('aria-label', `${cm.toFixed(1)} centimetres`);
    readoutLine.innerHTML =
      `<strong>${t.toFixed(3)} s</strong> flight · ${frames} frames @ ${fpsLabel(fps)} fps · ${inches.toFixed(1)} in`;
    drawTrajectory();
    reading.classList.remove('hidden');
    // one orchestrated trace of the arc when a result lands
    trajectory.classList.remove('animate');
    void trajectory.offsetWidth;
    trajectory.classList.add('animate');
  }

  // Draws the flight path itself: a parabola from the marked takeoff frame to the
  // landing frame, with the apex dimensioned. Height scales with the measured value,
  // so the diagram is a readout and not decoration.
  function drawTrajectory() {
    const VW = 320, VH = 136;
    const baseY = 120, topY = 30;
    const x0 = 16, x1 = VW - 16;
    const flight = (landingFrame - takeoffFrame) / fps;
    // normalise against a 1.2 s flight so a bigger jump visibly draws taller
    const f = Math.max(0.12, Math.min(1, flight / 1.2));
    const apexY = baseY - (baseY - topY) * f;
    const apexX = (x0 + x1) / 2;

    // quadratic through (x0,baseY), (apexX,apexY), (x1,baseY) -> control point
    const ctrlY = 2 * apexY - baseY;
    trajArc.setAttribute('d', `M ${x0} ${baseY} Q ${apexX} ${ctrlY} ${x1} ${baseY}`);

    trajBase.setAttribute('x1', 0); trajBase.setAttribute('x2', VW);
    trajBase.setAttribute('y1', baseY); trajBase.setAttribute('y2', baseY);

    trajApex.setAttribute('x1', apexX); trajApex.setAttribute('x2', apexX);
    trajApex.setAttribute('y1', baseY); trajApex.setAttribute('y2', apexY);

    [trajDotA, trajDotB].forEach((d2, i) => {
      d2.setAttribute('cx', i === 0 ? x0 : x1);
      d2.setAttribute('cy', baseY);
    });
    // anchored inward: the viewBox is stretched, so centred text overflows the card
    trajLblA.setAttribute('x', x0 - 4); trajLblA.setAttribute('y', baseY + 13);
    trajLblB.setAttribute('x', x1 + 4); trajLblB.setAttribute('y', baseY + 13);

    // total path length, so the trace animation can run edge to edge
    const len = 2 * Math.hypot(apexX - x0, apexY - baseY) * 1.06;
    trajectory.style.setProperty('--arc-len', len.toFixed(1));
  }

  /* =========================================================================
     INIT
     ========================================================================= */
  updateFpsUi();
